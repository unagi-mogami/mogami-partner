<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>もがみ 現場ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 墨のトップバー＋下部タブ。和紙白の作業面に深緑の操作、期限切れは朱で一目に。 */
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --sunk:#EEF0EB;
  --ink:#1B1F1D; --ink-2:#4B534E; --muted:#6E7671; --line:#DADED6;
  --green:#1F4A3A; --on-green:#FFFFFF; --green-soft:#E2EBE5;
  --sumi:#1B1F1D; --on-sumi:#F2F3EF;
  --amber:#8A5A1F; --amber-soft:#F3E8D7; --red:#A23B2C; --red-soft:#F5E1DC;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121513; --surface:#1A1E1B; --sunk:#222723; --ink:#ECEFEA; --ink-2:#C2C8C3; --muted:#9AA29C; --line:#333A35;
  --green:#8FC3A8; --on-green:#0F1F18; --green-soft:#21342B; --sumi:#0B0D0C; --on-sumi:#ECEFEA;
  --amber:#E8B66B; --amber-soft:#352A17; --red:#FF8F7E; --red-soft:#3A201B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.bar{background:var(--sumi);color:var(--on-sumi);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
header.bar h1{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
header.bar small{display:block;font-size:11px;letter-spacing:.2em;opacity:.7}
header.bar .who{font-size:14px;text-align:right}
header.bar .who b{font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h2{margin:4px 0 0;font-size:18px;font-weight:900;text-wrap:balance}
h3{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.bad{border-color:var(--red)!important;background:var(--red-soft)!important}
.btn{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.big{width:100%;min-height:56px;font-size:17px}
.btn.done{background:var(--green);border-color:var(--green);color:var(--on-green);min-width:120px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item.late{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-soft),var(--surface) 60%)}
.item.soon{border-left-color:var(--amber)}
.item.ok{border-left-color:var(--green)}
.item.fin{opacity:.75;border-left-color:var(--green)}
.item.flash{outline:3px solid var(--amber)}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .t{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.late{background:var(--red);color:var(--surface)}
.pill.soon{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.off{background:var(--sunk);color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center;font-size:14px}
.banner{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.banner.warn{background:var(--amber-soft);color:var(--ink)}
.banner.err{background:var(--red-soft);color:var(--ink)}
.banner.ok{background:var(--green-soft);color:var(--ink)}
.banner b{font-size:15px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs .dot{position:absolute;top:2px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.person{display:flex;flex-direction:column;gap:8px}
.person h3{display:flex;justify-content:space-between}
.grid{overflow-x:auto}
table.days{border-collapse:collapse;font-size:13px;width:100%;min-width:520px}
table.days th,table.days td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
table.days th{color:var(--muted)}
table.days select{min-height:38px;padding:4px;font-size:13px}
table.days input{min-height:38px;padding:4px 6px;font-size:14px}
.staff-row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.staff-row .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.toggle{font:inherit;font-size:12px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--muted);cursor:pointer;min-height:34px}
.toggle[aria-pressed="true"]{border-color:var(--green);color:var(--green);font-weight:700;background:var(--green-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--sumi);color:var(--on-sumi);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names .btn{min-height:56px}
.copybox{font-size:12px;word-break:break-all;background:var(--sunk);border-radius:8px;padding:8px;user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.celebrate div{opacity:1}}
.today-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.today-strip h3{margin-right:4px}
.ntag{display:inline-flex;gap:4px;align-items:center;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--amber-soft);color:var(--amber)}
.ntag.abs{background:var(--red-soft);color:var(--red)}
.ntag.info{background:var(--green-soft);color:var(--green)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--green);color:var(--on-green);border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:9px;padding:8px 4px;background:transparent;color:var(--muted);min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.alarms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alarms button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.alarms button b{font-size:15px}
.alarms button span{font-size:11px;color:var(--muted);line-height:1.4}
.alarms button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd button{font:inherit;width:44px;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;cursor:pointer}
.wd button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input,.inline select{width:auto;flex:1;min-width:80px}
.who-list{display:flex;flex-wrap:wrap;gap:4px 10px}
.who-list .ok{color:var(--green);font-weight:700}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--sunk);color:var(--ink-2)}
.hint{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--green)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:72px;resize:vertical}
textarea:focus{outline:3px solid var(--green);outline-offset:1px}
.datebtn{font:inherit;font-weight:700;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;min-height:48px;cursor:pointer;width:100%}
.datebtn[aria-expanded="true"]{border-color:var(--green)}
.cal{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.cal .ch{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.cal .ch button{font:inherit;font-size:20px;width:44px;height:40px;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);cursor:pointer}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .g .w{font-size:12px;color:var(--muted);font-weight:700}
.cal .g .w:first-child,.cal .g .sun{color:var(--red)}
.cal .g .sat{color:#3B6EA8}
.cal .g button{font:inherit;font-variant-numeric:tabular-nums;border:0;background:transparent;border-radius:999px;aspect-ratio:1;max-width:100%;cursor:pointer;color:var(--ink);font-size:15px}
.cal .g button.out{color:var(--muted);opacity:.45}
.cal .g button.today{box-shadow:inset 0 0 0 2px var(--green)}
.cal .g button.sel{background:var(--green);color:var(--on-green);font-weight:900}
.cal .q{display:flex;gap:6px}
.timepick{display:flex;align-items:center;gap:6px}
.timepick select{width:auto;flex:1;font-size:18px;font-weight:700;text-align:center}
.timepick span{font-weight:900;font-size:18px}
.note{background:var(--amber-soft);border-radius:8px;padding:6px 10px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.nudged{font-size:12px;color:var(--amber);font-weight:700}
.thread{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.cm{display:flex;flex-direction:column;background:var(--sunk);border-radius:10px;padding:6px 10px;max-width:92%}
.cm.me{align-self:flex-end;background:var(--green-soft)}
.cm b{font-size:12px;color:var(--ink-2)} .cm p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cm small{font-size:11px;color:var(--muted)}
.send{display:flex;gap:6px;align-items:flex-end}
.send textarea{min-height:44px;flex:1}
@media (prefers-color-scheme:dark){.cal .g .sat{color:#8FB6E8}}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s}
.item.pressing{transform:scale(.97)}
.item .note,.item .cm p{-webkit-user-select:text;user-select:text}
.react{position:fixed;z-index:70;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:6px 8px;display:flex;gap:2px;animation:rin .15s ease-out;max-width:calc(100vw - 24px)}
.react button{font:inherit;border:0;background:transparent;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 6px;min-width:52px;color:var(--ink)}
.react button .e{font-size:30px;line-height:1.15;transition:transform .1s}
.react button:active .e,.react button:hover .e{transform:scale(1.25)}
.react button small{font-size:10px;color:var(--muted);white-space:nowrap}
.react-bg{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.12)}
@keyframes rin{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.duty{display:flex;flex-direction:column;gap:10px}
.duty .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.duty .dh h2{margin:0;font-size:20px}
.drow{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:center}
.drow .d{font-size:20px;font-weight:900;text-align:center}
.drow .d.sun{color:var(--red)} .drow .d.sat{color:#3B6EA8}
.drow .p{font:inherit;font-size:19px;font-weight:700;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.drow .p.empty-p{color:var(--muted);border-style:dashed;font-weight:500}
.drow.today .p{border-color:var(--green);background:var(--green-soft)}
.drow.today .d::after{content:"今日";display:block;font-size:10px;color:var(--green)}
.pick{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);border-radius:12px;padding:8px}
.pick button{font:inherit;font-size:16px;font-weight:700;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.todaylist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:17px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.trow b{font-size:18px}
@media (prefers-color-scheme:dark){.drow .d.sat{color:#8FB6E8}}
.hello p{margin:0;font-size:18px}
.hello b{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;color:var(--ink);text-decoration:none;min-width:0}
.tile b{font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);line-height:1.4}
.tile em{font-style:normal;color:var(--red);font-weight:700}
.tile.bad{border-color:var(--red);background:var(--red-soft)} .tile.bad b{color:var(--red)}
.tile.warn{border-color:var(--amber);background:var(--amber-soft)}
.nlist,.clist{display:flex;flex-direction:column;gap:6px}
.nrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;overflow-wrap:anywhere}
.nrow:last-child{border-bottom:0}
.crow{display:grid;grid-template-columns:3.2em 1fr auto;grid-template-areas:"tm w pill" "tm p pill";gap:0 8px;align-items:center;color:var(--ink);text-decoration:none;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.crow .tm{grid-area:tm;font-weight:900;font-variant-numeric:tabular-nums}
.crow .w{grid-area:w;font-weight:700;min-width:0;overflow-wrap:anywhere}
.crow .p{grid-area:p;font-size:12px;color:var(--muted)}
.crow .pill{grid-area:pill}
.crow.late{background:var(--red-soft)} .crow.late .tm{color:var(--red)}
.stpop{position:fixed;z-index:70;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:rin .15s ease-out}
.stpop .sh{display:flex;align-items:center;gap:8px}
.stpop .sh .e{font-size:30px}
.stpop .sl{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow-y:auto}
.stpop .si{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.stpop .si:last-child{border-bottom:0}
.stamps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stc{font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;min-height:34px}
.stc[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);font-weight:700}
.stc.add{color:var(--muted);border-style:dashed}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.palette button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.palette button .e{font-size:28px;line-height:1.1}
.week{display:flex;flex-direction:column;gap:8px}
.week .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.week .big div{background:var(--sunk);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.week .big b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.week .big span{font-size:12px;color:var(--muted)}
.rank{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.rank .h{font-size:11px;color:var(--muted)}
.king{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.celebrate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none}
.celebrate div{background:var(--surface);border:3px solid var(--green);border-radius:28px;padding:22px 30px;font-size:24px;font-weight:900;color:var(--green);box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop 1.3s ease forwards;text-align:center}
.celebrate div .e{display:block;font-size:56px}
@keyframes pop{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.08);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
</style>
</head>
<body>
<header class="bar"><div><small>株式会社もがみ</small><h1>現場ノート</h1></div><div class="who" id="who"></div></header>
<main id="app"><div class="empty">読み込み中です…</div></main>
<button class="fab" id="fab" hidden>＋ やることを追加</button>
<div class="sheet" id="sheet" hidden></div>
<nav class="tabs" id="tabs" hidden></nav>
<script>
"use strict";
const WD = ["日","月","火","水","木","金","土"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const ss = { get(k){ try { return sessionStorage.getItem(k) || ""; } catch(e){ return ""; } }, set(k,v){ try { sessionStorage.setItem(k, v); } catch(e){} } };

let cfg = ls.get("genba") || {};            // {url, code, me}
let S = null;                               // 受付係から届いた状態
let tab = "mine", busy = false, flashId = "", pin = ls.get("genba-pin") || "";
let adm = null;                             // 管理画面の編集中データ
let F = null;                               // やることの登録・編集フォーム
let N = null;                               // 連絡フォーム
let ui = { setup: "", allFilter: "late" };

/* ---------- 受付係とのやりとり ---------- */
const ERR = { code:"合言葉が違います。社長から届いた招待リンクを開き直してください。", pin:"暗証番号が違います。", locked:"間違いが続いたので15分間止めています。少し待ってからもう一度。",
  notready:"受付係の初期設定がまだです。社長の初期設定をしてください。", already:"初期設定はもう済んでいます。招待リンクから入ってください。", input:"入力に足りないところがあります。",
  noowner:"社長を1人以上残してください。", nudged:"さっき催促したばかりです。10分あけてください。", samename:"同じ名前の人がいます。少し変えてください（例：佐藤 慧斗）。", gone:"このやることはもう消されています。" };
async function api(action, body = {}, url = cfg.url) {
  let r;
  try {
    r = await fetch(url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ action, code: cfg.code, by: cfg.me, ...body }) });
  } catch(e) { throw new Error("つながりませんでした。電波を確認して、もう一度押してください。"); }
  let j; try { j = await r.json(); } catch(e) { throw new Error("受付係から正しい返事がありません。URLが合っているか確認してください。"); }
  if (!j.ok) throw new Error(ERR[j.err] || ("うまくいきませんでした（" + (j.err || "エラー") + "）"));
  if (j.state) S = j.state;
  return j;
}
async function act(action, body, okMsg) {
  if (busy) return; busy = true;
  try { const r = await api(action, body); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); }
  catch(e) { toast(e.message, 5000); }
  busy = false; render();
}
async function refresh(quiet) {
  if (!cfg.url) return;
  try { await api("state"); } catch(e) { if (!quiet) toast(e.message, 5000); }
  render();
}

/* ---------- 便利関数 ---------- */
const staff = id => (S && S.staff.find(s => s.id === id)) || null;
const active = () => S.staff.filter(s => s.active);
const nm = id => (staff(id) || {}).name || "（いない人）";
const meObj = () => staff(cfg.me);
const av = id => { const s = staff(id); return s && s.icon ? s.icon + " " : ""; };
const isOwner = () => !!(meObj() && meObj().owner);
const whoList = t => String(t.who || "").split(",").filter(Boolean);
const pendingOf = t => t.mode === "all" ? whoList(t).filter(w => !(t.doneMap || {})[w]) : whoList(t);
const fmt = ms => { const d = new Date(ms); return (d.getMonth()+1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ") " + d.getHours() + ":" + pad(d.getMinutes()); };
const hmOnly = ms => { const d = new Date(ms); return d.getHours() + ":" + pad(d.getMinutes()); };
const span = ms => { const m = Math.round(Math.abs(ms)/60000); if (m < 60) return m + "分"; const h = Math.floor(m/60); return h < 48 ? h + "時間" + (m%60 && h < 6 ? (m%60) + "分" : "") : Math.floor(h/24) + "日"; };
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const mdw = s => { const [y,m,d] = s.split("-").map(Number); return m + "/" + d + "(" + WD[new Date(y, m-1, d).getDay()] + ")"; };
function taskState(t) { const d = t.due - Date.now(); return t.done ? "fin" : d < 0 ? "late" : d < 3600e3 ? "soon" : "ok"; }
function toast(t, ms = 2500) { document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
const todayCleanFor = id => S ? S.areas.filter(a => a["d" + S.weekday] === id) : [];
const cleanLog = aid => S && S.clean.find(c => c.area === aid);
const cleanDeadline = a => new Date(S.today + "T" + a.deadline + ":00+09:00").getTime();
const seriesOf = t => t.series && S.series.find(s => s.id === t.series);
const todayNotices = () => (S.notices || []).filter(n => n.kind !== "メッセージ" && n.from <= S.today && n.to >= S.today);
const awayToday = id => todayNotices().find(n => n.who === id && (n.kind === "欠勤" || n.kind === "休み"));
const REMIND = [[0,"なし"],[5,"5分前"],[10,"10分前"],[15,"15分前"],[30,"30分前"],[60,"1時間前"],[120,"2時間前"],[180,"3時間前"],[1440,"前日（24時間前）"]];
const STAMP = { arigato:["🙏","ありがとう"], otsukare:["💪","おつかれ！"], sugoi:["✨","すごい！"], tasukatta:["🙌","助かった"], nice:["👍","ナイス"], unagi:["🐟","うなぎのぼり！"], odaiji:["🍵","お大事に"], ryokai:["👌","了解"], ganbare:["📣","がんばって！"], yoroshiku:["🤝","よろしく！"] };
const PAL = { cheer:["ganbare","yoroshiku","arigato","nice"], work:["arigato","otsukare","sugoi","tasukatta","nice","unagi"], away:["odaiji","ryokai","arigato"], info:["ryokai","arigato","nice"] };
function stampRow(target, pal, owners) {
  const list = (S.stamps || []).filter(x => x.target === target);
  const agg = {};
  list.forEach(x => { const k = x.stamp; agg[k] = agg[k] || { n: new Set(), me: false }; agg[k].n.add(x.from); if (x.from === cfg.me) agg[k].me = true; });
  const mine = (owners || []).includes(cfg.me);
  const chips = Object.entries(agg).map(([k,v]) => `<button class="stc" data-a="stwho" data-id="${esc(target)}" data-v="${k}" aria-pressed="${v.me}" aria-label="${STAMP[k][1]}を送った人を見る">${STAMP[k][0]} ${STAMP[k][1]} ${v.n.size}</button>`).join("");
  if (!chips && mine) return "";
  return `<div class="stamps">${chips}<button class="stc add" data-a="react" data-id="${esc(target)}" data-pal="${pal}" aria-label="スタンプを送る">😊＋</button></div>`;
}
const doersOf = t => t.mode === "all" ? Object.keys(t.doneMap || {}) : [t.doneBy];
function celebrate() {
  const msgs = [["🎉","おつかれさまです！"],["💪","ナイス！"],["🐟","うなぎのぼり！"],["✨","いいね！"]];
  const [e, m] = msgs[Math.floor(Math.random() * msgs.length)];
  const el = document.createElement("div"); el.className = "celebrate"; el.innerHTML = `<div><span class="e">${e}</span>${m}</div>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
}
function weekPanel(onlyMe) {
  const st = S.stats || {}, ids = active().map(s => s.id);
  const sum = k => ids.reduce((a, id) => a + ((st[id] || {})[k] || 0), 0);
  if (onlyMe) {
    const m = st[cfg.me] || { done:0, ontime:0, clean:0, stamps:0 };
    const got = (S.stamps || []).filter(x => x.to === cfg.me && x.from !== cfg.me).sort((a,b) => b.at - a.at).slice(0, 5);
    return `<div class="panel week"><h3>あなたのこの7日間</h3><div class="big"><div><b>${m.done + m.clean}</b><span>終わらせた数</span></div><div><b>${m.done ? Math.round(m.ontime / m.done * 100) + "%" : "–"}</b><span>期限内</span></div><div><b>${m.stamps}</b><span>もらったスタンプ</span></div></div>
      ${got.length ? `<div class="stamps">${got.map(x => `<span class="ntag info">${STAMP[x.stamp][0]} ${esc(nm(x.from))}さん「${STAMP[x.stamp][1]}」</span>`).join("")}</div>` : ""}</div>`;
  }
  const rows = ids.map(id => ({ id, ...(st[id] || { done:0, ontime:0, clean:0, stamps:0 }) })).sort((a,b) => (b.done + b.clean) - (a.done + a.clean) || b.stamps - a.stamps);
  const king = rows.slice().sort((a,b) => b.stamps - a.stamps)[0];
  const done = sum("done");
  return `<div class="panel week"><h2>みんなのこの7日間</h2>
    <div class="big"><div><b>${done + sum("clean")}</b><span>みんなで終わらせた数</span></div><div><b>${done ? Math.round(sum("ontime") / done * 100) + "%" : "–"}</b><span>期限内に完了</span></div><div><b>${sum("stamps")}</b><span>送り合ったスタンプ</span></div></div>
    ${king && king.stamps ? `<div class="king">👑 ありがとうを一番もらった人：${esc(nm(king.id))}さん（${king.stamps}個）</div>` : ""}
    <div class="rank"><span class="h">名前</span><span class="h">✅ 完了</span><span class="h">🧹 掃除</span><span class="h">💌 スタンプ</span>
    ${rows.map(r => `<span>${esc(nm(r.id))}</span><span>${r.done}</span><span>${r.clean}</span><span>${r.stamps}</span>`).join("")}</div></div>`;
}
const CATS = [["","なし"],["掃除","🧹 掃除"],["事務","📋 事務"],["配達","🚚 配達"],["仕込み","🔪 仕込み"],["その他","📦 その他"]];
const catLabel = c => (CATS.find(x => x[0] === c) || ["",""])[1];
function rotDays() { return F.rep === "weekly" ? F.days.slice().sort() : F.rep === "daily" ? [0,1,2,3,4,5,6] : F.rep === "weekdays" ? [1,2,3,4,5] : []; }
const rotAllowed = () => ["weekly","daily","weekdays"].includes(F.rep);
const ALARM = { normal:["ふつう","期限に1回知らせる"], repeat:["しつこく","終わるまで5分おきに3回まで"], silent:["音なし","音を鳴らさず画面に出すだけ"] };
function ruleLabel(r) {
  if (!r) return "";
  const n = r.every > 1 ? r.every : 0;
  if (r.type === "daily") return n ? n + "日ごと" : "毎日";
  if (r.type === "weekdays") return "平日（月〜金）";
  if (r.type === "weekly") return (n ? n + "週ごと " : "毎週 ") + r.days.slice().sort().map(d => WD[d]).join("・");
  if (r.type === "monthly") return (n ? n + "か月ごと " : "毎月 ") + r.dom + "日";
  return "";
}

/* ---------- カレンダーと時刻（F.date のようなキーで値を出し入れ） ---------- */
function getV(k) { const [o, f] = k.split("."); return (o === "F" ? F : N)[f]; }
function setV(k, v) { const [o, f] = k.split("."); (o === "F" ? F : N)[f] = v; }
const reRender = k => k.startsWith("F.") ? renderSheet() : render();
function mdwLong(v) { const [y,m,d] = v.split("-").map(Number); const dt = new Date(y, m-1, d), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((dt - t) / 864e5); return y + "年" + m + "月" + d + "日(" + WD[dt.getDay()] + ")" + (diff === 0 ? "　今日" : diff === 1 ? "　明日" : diff === -1 ? "　昨日" : ""); }
function calField(k, label) {
  const v = getV(k), open = ui.cal === k;
  return `<div class="field"><label>${label}</label><button type="button" class="datebtn" data-a="cal" data-k="${k}" aria-expanded="${open}">📅 ${v ? esc(mdwLong(v)) : "日付を選ぶ"}</button>${open ? calGrid(k, v) : ""}</div>`;
}
function calGrid(k, v) {
  const [y, m] = (ui.calMonth || v || ymd(new Date())).split("-").map(Number);
  const first = new Date(y, m-1, 1), start = new Date(y, m-1, 1 - first.getDay()), tdy = ymd(new Date());
  let cells = "";
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); const s = ymd(d);
    if (i === 35 && d.getMonth() !== m-1) break;
    cells += `<button type="button" data-a="cald" data-k="${k}" data-v="${s}" class="${d.getMonth() !== m-1 ? "out " : ""}${s === tdy ? "today " : ""}${s === v ? "sel " : ""}${d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : ""}" aria-label="${d.getMonth()+1}月${d.getDate()}日">${d.getDate()}</button>`; }
  const q = [["今日",0],["明日",1],["あさって",2],["1週間後",7]].map(([l,n]) => { const d = new Date(); d.setDate(d.getDate()+n); return `<button type="button" class="btn sm" data-a="cald" data-k="${k}" data-v="${ymd(d)}">${l}</button>`; }).join("");
  return `<div class="cal"><div class="ch"><button type="button" data-a="calm" data-k="${k}" data-v="-1" aria-label="前の月">‹</button><span>${y}年${m}月</span><button type="button" data-a="calm" data-k="${k}" data-v="1" aria-label="次の月">›</button></div>
    <div class="g">${WD.map(w => `<span class="w">${w}</span>`).join("")}${cells}</div><div class="q">${q}</div></div>`;
}
function timeField(k, label) {
  const [h, mi] = (getV(k) || "00:00").split(":");
  return `<div class="field"><label>${label}</label><div class="timepick">
    <select data-tk="${k}" data-part="h" aria-label="時">${Array.from({length:24}, (_,i) => `<option value="${pad(i)}"${pad(i)===h?" selected":""}>${i}時</option>`).join("")}</select><span>:</span>
    <select data-tk="${k}" data-part="m" aria-label="分">${Array.from({length:60}, (_,i) => `<option value="${pad(i)}"${pad(i)===mi?" selected":""}>${pad(i)}分</option>`).join("")}</select></div></div>`;
}
function thread(target) {
  const list = (S.comments || []).filter(c => c.target === target).sort((a,b) => a.at - b.at);
  return `<div class="thread">${list.map(c => `<div class="cm${c.from === cfg.me ? " me" : ""}"><b>${esc(av(c.from) + nm(c.from))}</b><p>${esc(c.text)}</p><small>${esc(fmt(c.at))}${c.from === cfg.me ? ` ・ <a href="#" data-a="cdel" data-id="${esc(c.id)}" style="color:inherit">消す</a>` : ""}</small></div>`).join("") || `<p class="hint">まだメッセージはありません。</p>`}
    <div class="send"><textarea id="cm-${esc(target)}" maxlength="300" placeholder="メッセージを書く"></textarea><button class="btn primary sm" data-a="csend" data-id="${esc(target)}">送る</button></div></div>`;
}
const cCount = target => (S.comments || []).filter(c => c.target === target).length;

/* ---------- 長押しでスタンプ（LINEのリアクションのように） ---------- */
let lp = null;
function closeReact() { document.querySelectorAll(".react,.react-bg,.stpop").forEach(x => x.remove()); }
/* スタンプを押したら、誰が送ったかを出す */
function showStampWho(target, k, el) {
  closeReact();
  const list = (S.stamps || []).filter(x => x.target === target && x.stamp === k);
  const by = {}; list.forEach(x => { if (!by[x.from] || by[x.from] < x.at) by[x.from] = x.at; });
  const people = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const mine = !!by[cfg.me];
  const bg = document.createElement("div"); bg.className = "react-bg"; bg.addEventListener("click", closeReact);
  const box = document.createElement("div"); box.className = "stpop"; box.setAttribute("role", "dialog");
  box.innerHTML = `<div class="sh"><span class="e">${STAMP[k][0]}</span><b>${STAMP[k][1]}</b><span class="muted small">${people.length}人</span></div>
    <div class="sl">${people.map(([id, at]) => `<div class="si"><span>${esc(av(id) + nm(id))}${id === cfg.me ? "（自分）" : ""}</span><span class="muted small">${esc(fmt(at))}</span></div>`).join("")}</div>
    <div class="acts"><button class="btn sm${mine ? " ghost" : " primary"}" data-a="stamp" data-id="${esc(target)}" data-v="${k}">${mine ? "自分の分を取り消す" : "自分も送る"}</button><button class="btn sm ghost" data-a="stclose">閉じる</button></div>`;
  document.body.append(bg, box);
  const r = el.getBoundingClientRect(), hgt = box.offsetHeight;
  box.style.top = Math.max(12, Math.min(window.innerHeight - hgt - 90, r.top - hgt - 8 < 12 ? r.bottom + 8 : r.top - hgt - 8)) + "px";
}
function openReact(target, pal, el) {
  closeReact();
  if (navigator.vibrate) navigator.vibrate(15);
  const mine = (S.stamps || []).filter(x => x.target === target && x.from === cfg.me).map(x => x.stamp);
  const bg = document.createElement("div"); bg.className = "react-bg"; bg.addEventListener("click", closeReact);
  const bar = document.createElement("div"); bar.className = "react"; bar.setAttribute("role", "menu");
  bar.innerHTML = (PAL[pal] || PAL.work).map(k => `<button data-a="stamp" data-id="${esc(target)}" data-v="${k}" role="menuitem" aria-pressed="${mine.includes(k)}" style="${mine.includes(k) ? "background:var(--amber-soft)" : ""}"><span class="e">${STAMP[k][0]}</span><small>${STAMP[k][1]}</small></button>`).join("");
  document.body.append(bg, bar);
  const r = el ? el.getBoundingClientRect() : { top: window.innerHeight / 2 };
  const top = Math.max(r.top - bar.offsetHeight - 8, 12 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0));
  bar.style.top = top + "px";
}
document.addEventListener("pointerdown", e => {
  const it = e.target.closest("[data-react]");
  if (!it || e.target.closest("button,a,input,textarea,select,summary")) return;
  it.classList.add("pressing");
  lp = { it, x: e.clientX, y: e.clientY, timer: setTimeout(() => { it.classList.remove("pressing"); lp = null; openReact(it.dataset.react, it.dataset.pal, it); }, 450) };
});
const lpCancel = () => { if (lp) { clearTimeout(lp.timer); lp.it.classList.remove("pressing"); lp = null; } };
document.addEventListener("pointermove", e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) lpCancel(); });
document.addEventListener("pointerup", lpCancel); document.addEventListener("pointercancel", lpCancel);
window.addEventListener("scroll", () => { lpCancel(); }, { passive: true });
document.addEventListener("contextmenu", e => { const it = e.target.closest("[data-react]"); if (it) { e.preventDefault(); lpCancel(); openReact(it.dataset.react, it.dataset.pal, it); } });

/* ---------- アプリを開いている時の音 ----------
   iPhoneはマナーモードだとWeb Audioが鳴らないため、音のデータ（WAV）を作って <audio> で鳴らす */
const tones = {};
function wav(notes, step, vol, wave, decay) {
  const sr = 22050, len = Math.ceil(sr * step * (notes.length + 1)), d = new Int16Array(len);
  notes.forEach((f, i) => { const st = Math.floor(i * step * sr), n = Math.floor(step * 1.4 * sr);
    if (!f) return;
    for (let k = 0; k < n && st + k < len; k++) { const t = k / sr, env = Math.min(1, k / (sr * 0.01)) * Math.exp(-t * (decay || 6)), ph = Math.sin(2 * Math.PI * f * t);
      const w = wave === "square" ? (ph >= 0 ? 0.6 : -0.6) : wave === "bell" ? ph * 0.7 + Math.sin(2 * Math.PI * f * 2.76 * t) * 0.3 * Math.exp(-t * 9) : ph;
      d[st + k] = Math.max(-32767, Math.min(32767, d[st + k] + w * env * vol * 32767)); } });
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf), w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, len * 2, true);
  new Int16Array(buf, 44).set(d);

const formKey = f => JSON.stringify([f.what, f.note, f.who, f.mode, f.date, f.time, f.remind, f.alarm, f.rep, f.every, f.unit, f.days, f.cat, f.rotOn, f.rot]);

function openForm(t) {

  else {

    ui.cal = ""; F = { cat: t.cat || "", rotOn: !!(s && s.rot && Object.keys(s.rot).length), rot: s && s.rot ? { ...s.rot } : {}, note: t.note || "", id:t.id, what:t.what, who:whoList(t), mode:t.mode || "any", date: ymd(d), time: hhmm(d), remind:t.remind || 0, alarm:t.alarm || "normal", rep, every: r ? r.every : 1, unit, days: r && r.days.length ? r.days.slice() : [d.getDay()], series: !!s };
  }

    else if (a === "fsave") { saveForm(); return; }
    else if (a === "fdel" || a === "fdelall") {
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "本当に消す"; return; }
      const fid = F.id; F = null; renderSheet(); act("delTask", { id: fid, stop: a === "fdelall" }, a === "fdelall" ? "繰り返しを止めました" : "消しました"); return;
    }
    renderSheet(); return;
  }
  if (a === "cal") { const k = b.dataset.k; if (k.startsWith("N.")) syncNotice(); ui.cal = ui.cal === k ? "" : k; ui.calMonth = (getV(k) || ymd(new Date())).slice(0,7); reRender(k); return; }
  if (a === "calm") { const k = b.dataset.k; const [y,m] = ui.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(v), 1); ui.calMonth = d.getFullYear() + "-" + pad(d.getMonth()+1); if (k.startsWith("N.")) syncNotice(); reRender(k); return; }
  if (a === "cald") { const k = b.dataset.k; if (k.startsWith("N.")) syncNotice(); setV(k, v); if (k === "N.from" && (!N.range || N.to < v)) N.to = v; if (k === "F.date" && F.rep !== "none" && F.days.length <= 1) F.days = [new Date(v + "T00:00").getDay()]; ui.cal = ""; reRender(k); return; }
  if (a === "setup") { ui.setup = v; render(); }
  else if (a === "pick") { cfg.me = id; ls.set("genba", cfg); remember(); tab = "mine"; render(); swInit(); }
  else if (a === "reset") { cfg = {}; ls.set("genba", cfg); S = null; try { history.replaceState(null, "", location.pathname); } catch(e) {} render(); }
  else if (a === "push") enablePush();
  else if (a === "test") testPush();
  else if (a === "repush") rePush();
  else if (a === "snd" && v === "custom") { soundPick = "custom"; ls.set("genba-sound", "custom"); unlocked = true; chime("normal"); render(); if (PR) renderProfile(); }
  else if (a === "snd") { soundPick = v; ls.set("genba-sound", v); unlocked = true; chime("normal", v); render(); if (PR) renderProfile(); }
  else if (a === "sound") { unlocked = true; chime("normal"); toast("この音が鳴れば、アプリを開いている時の音はOKです。鳴らない時は本体の音量を上げてください", 5000); }
  else if (a === "done") { celebrate(); act("doneTask", { id }); }
  else if (a === "dpick") { const d = Number(v); ui.pick = ui.pick && ui.pick.id === id && ui.pick.day === d ? null : { id, day: d }; render(); }
  else if (a === "dset") { const day = Number(b.dataset.day); ui.pick = null; act("setRotDay", { id, day, who: v }, v ? WD[day] + "曜を" + nm(v) + "さんにしました" : WD[day] + "曜の当番をなしにしました"); }
  else if (a === "dedit") { const t = S.tasks.find(x => x.series === id && !x.done) || S.tasks.find(x => x.series === id); if (t) openForm(t); else toast("今週の分がまだ出ていないので、曜日の担当だけ変えられます", 4000); }
  else if (a === "dnew") { openForm(null); F.cat = "掃除"; F.rep = "weekly"; F.days = [0,1,2,3,4,5,6]; F.rotOn = true; F.time = "06:00"; renderSheet(); }
  else if (a === "stwho") { showStampWho(id, v, b); }
  else if (a === "stclose") { closeReact(); }
  else if (a === "react") { openReact(id, b.dataset.pal, b.closest("[data-react]") || b); }
  else if (a === "stamp") { closeReact(); if (navigator.vibrate) navigator.vibrate(10); act("stamp", { target: id, stamp: v }, r => (r.state.stamps || []).some(x => x.target === id && x.stamp === v && x.from === cfg.me) ? STAMP[v][0] + " を送りました" : "取り消しました"); }
  else if (a === "undo") act("undoTask", { id });
  else if (a === "edit") { const t = S.tasks.find(x => x.id === id); if (t) openForm(t); }
  else if (a === "nudge") { ui.nudge = ui.nudge === id ? "" : id; render(); const el = document.getElementById("ng-" + id); if (el) el.focus(); }
  else if (a === "nsend") { const el = document.getElementById("ng-" + id); const msg = el ? el.value.trim() : ""; ui.nudge = ""; act("nudge", { id, msg }, r => r.sent ? "催促を送りました" : "相手の通知がオフのため、届いていません"); }
  else if (a === "thr") { ui.thread = ui.thread === id ? "" : id; render(); }
  else if (a === "csend") { const el = document.getElementById("cm-" + id); const text = el ? el.value.trim() : ""; if (!text) { toast("メッセージを書いてください"); return; } el.value = ""; act("comment", { target: id, text }, "送りました"); }
  else if (a === "cdel") { e.preventDefault(); act("delComment", { id }); }
  else if (a === "nto") { syncNotice(); N.to2 = N.to2.includes(v) ? N.to2.filter(x => x !== v) : N.to2.concat(v); render(); }
  else if (a === "stop") { if (b.dataset.sure) act("stopSeries", { id }, "繰り返しを止めました"); else { b.dataset.sure = "1"; b.textContent = "本当に止める"; } }
  else if (a === "cdone") { celebrate(); act("cleanDone", { area: id }); }
  else if (a === "cundo") act("cleanUndo", { area: id });
  else if (a === "af") { ui.allFilter = v; render(); }
  else if (a === "cf") { ui.cat = v; render(); }
  // 連絡板
  else if (a === "nnew") { N = newNotice(); render(); }
  else if (a === "ncancel") { N = null; render(); }
  else if (a === "nk") { syncNotice(); N.kind = v; if (v === "メッセージ" && N.when === "none") N.when = "now"; render(); }
  else if (a === "nw") { syncNotice(); N.when = v; render(); }
  else if (a === "nt") { syncNotice(); N.to_ = v; render(); }
  else if (a === "nrange") { syncNotice(); N.range = true; render(); }
  else if (a === "ndel") { if (b.dataset.sure) act("delNotice", { id }, "消しました"); else { b.dataset.sure = "1"; b.textContent = "本当に消す"; b.classList.add("danger"); } }
  // 管理
  else if (a === "copy") { try { await navigator.clipboard.writeText(inviteText()); toast("コピーしました"); } catch(x) { toast("下のリンクを長押ししてコピーしてください", 4000); } }
  else if (a === "sl" || a === "so") { const s = adm.staff.find(x => x.id === id); const k = a === "sl" ? "leader" : "owner"; s[k] = !s[k]; adm.dirtyS = true; render(); }
  else if (a === "sx") { if (b.dataset.sure) { adm.staff = adm.staff.filter(x => x.id !== id); adm.dirtyS = true; render(); } else { b.dataset.sure = "1"; b.textContent = "本当に外す"; b.style.color = "var(--red)"; } }
  else if (a === "aadd") { adm.areas.push({ id: newId("a"), name:"", deadline:"06:00", days:["","","","","","",""] }); adm.dirtyA = true; render(); }
  else if (a === "ax") { adm.areas.splice(Number(b.dataset.k), 1); adm.dirtyA = true; render(); }
  else if (a === "saveStaff") adminSave("saveStaff", { staff: adm.staff }, "社員を保存しました");
  else if (a === "saveAreas") adminSave("saveAreas", { areas: adm.areas }, "掃除当番を保存しました");
});
function syncNotice() {
  if (!N) return;
  if ($("#nWho")) N.who = $("#nWho").value;
  if ($("#nNote")) N.note = $("#nNote").value;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (F && el.closest("#sheet")) {
    if (el.id === "fWhat" || el.id === "fNote") { saveDraft(); }
    if (el.id === "fRotOn") { F.rotOn = el.checked; renderSheet(); return; }
    if (el.dataset.rot !== undefined) { F.rot[el.dataset.rot] = el.value; return; }
    if (el.id === "fDate") F.date = el.value;
    if (el.id === "fTime") F.time = el.value;
    if (el.id === "fRemind") F.remind = Number(el.value);
    if (el.id === "fEvery") F.every = Math.max(1, Number(el.value) || 1);
    if (el.id === "fUnit") { F.unit = el.value; renderSheet(); }
    return;
  }
  if (el.dataset && el.dataset.ar !== undefined && adm) { const ar = adm.areas[Number(el.dataset.ar)]; if (el.dataset.d !== undefined) ar.days[Number(el.dataset.d)] = el.value; else ar[el.dataset.f] = el.value; adm.dirtyA = true;
    const sv = document.querySelector('[data-a="saveAreas"]'); if (sv) sv.disabled = false; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "sndFile") { saveCustom(el.files && el.files[0]); el.value = ""; return; }
  if (el.dataset && el.dataset.tk) { const k = el.dataset.tk; if (k.startsWith("N.")) syncNotice(); const [h, m] = (getV(k) || "00:00").split(":"); setV(k, el.dataset.part === "h" ? el.value + ":" + m : h + ":" + el.value); return; }
  if (el.id === "fRotOn" || (el.dataset && el.dataset.rot !== undefined)) el.dispatchEvent(new Event("input", { bubbles: true }));
  else if (el.id === "fUnit" || el.id === "fRemind") el.dispatchEvent(new Event("input", { bubbles: true }));
  else if (el.dataset && el.dataset.d !== undefined) el.dispatchEvent(new Event("input", { bubbles: true }));
});
async function adminSave(action, body, msg) {
  if (busy) return; busy = true; render();
  try { await api(action, { pin, ...body }); adm = null; toast(msg); }
  catch(e) { toast(e.message, 5000); if (/暗証番号/.test(e.message)) { pin = ""; ls.set("genba-pin", ""); } }
  busy = false; render();
}
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  const mark = (ids) => { let bad = false; ids.forEach(id => { const el = $("#" + id); const ng = !el.value.trim(); el.classList.toggle("bad", ng); bad = bad || ng; }); return bad; };
  if (f.id === "taskForm") { saveForm(); }
  else if (f.id === "noticeForm") {
    syncNotice();
    if ((N.kind === "連絡" || N.kind === "メッセージ") && !N.note.trim()) { $("#nNote").classList.add("bad"); toast("内容を入れてください"); return; }
    if (N.kind === "メッセージ" && !N.to2.length) { toast("宛先を選んでください"); return; }
    if (N.kind === "メッセージ") N.from = N.to = ymd(new Date());
    if (!N.from) { toast("日付を入れてください"); return; }
    let notifyAt = 0;
    if (N.when === "at") { notifyAt = new Date(N.atDate + "T" + N.atTime).getTime(); if (!(notifyAt > Date.now())) { toast("送る日時は、今より後にしてください"); return; } }
    const body = { to2: N.to2, kind: N.kind, who: (N.kind === "連絡" || N.kind === "メッセージ") ? "" : N.who, from: N.from, to: N.range ? N.to : N.from, note: N.note.trim(), notifyAt, notifyTo: N.when === "none" ? "none" : N.to_ };
    if (busy) return; busy = true;
    try { await api("addNotice", body); toast(N.kind === "メッセージ" && N.when === "now" ? "メッセージを送りました" : N.when === "now" ? "登録して通知しました" : N.when === "at" ? "登録しました。指定の日時に通知します" : "登録しました"); N = null; }
    catch(x) { toast(x.message, 5000); }
    busy = false; render();
  }
  else if (f.id === "initForm") {
    if (mark(["iUrl","iCode","iName","iPin"])) return;
    const url = $("#iUrl").value.trim(), code = $("#iCode").value.trim(), pin_ = $("#iPin").value.trim(), name = $("#iName").value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { $("#iUrl").classList.add("bad"); toast("URLは https://script.google.com/… で始まり /exec で終わるものです", 5000); return; }
    if (code.length < 4) { $("#iCode").classList.add("bad"); toast("合言葉は4文字以上にしてください"); return; }
    if (!/^\d{4}$/.test(pin_)) { $("#iPin").classList.add("bad"); toast("暗証番号は数字4けたです"); return; }
    busy = true; render();
    try {
      cfg = { url, code };
      const r = await api("init", { pin: pin_, name }, url);
      cfg.me = r.ownerId; ls.set("genba", cfg); remember(); pin = pin_; ls.set("genba-pin", pin_); tab = "admin";
      toast(r.trigger ? "初期設定ができました" : "初期設定はできましたが、自動チェックの登録に失敗しました。受付係で setupTrigger を1回実行してください", 7000);
      swInit();
    } catch(x) { cfg = {}; toast(x.message, 6000); }
    busy = false; render();
  }
  else if (f.id === "joinForm") {
    if (mark(["jUrl","jCode"])) return;
    join($("#jUrl").value.trim(), $("#jCode").value.trim());
  }
  else if (f.id === "pinForm") {
    const p = $("#pinIn").value.trim(); if (!p) return;
    busy = true; render();
    try { await api("adminCheck", { pin: p }); pin = p; ls.set("genba-pin", p); adm = null; } catch(x) { toast(x.message, 4000); }
    busy = false; render();
  }
  else if (f.id === "staffAdd") {
    const n = $("#newStaff").value.trim(); if (!n) return;
    adm.staff.push({ id: newId("s"), name:n, leader:false, owner:false, active:true }); adm.dirtyS = true; $("#newStaff").value = ""; render(); $("#newStaff").focus();
  }
  else if (f.id === "cfgForm") {
    const body = { escMin: Number($("#cEsc").value), summaryTime: $("#cSum").value, newPin: $("#cPin").value.trim(), newCode: $("#cCode").value.trim() };
    if (body.newPin && !/^\d{4}$/.test(body.newPin)) { toast("暗証番号は数字4けたです"); return; }
    if (body.newCode && body.newCode.length < 4) { toast("合言葉は4文字以上にしてください"); return; }
    await adminSave("saveConfig", body, "保存しました");
    if (body.newPin) { pin = body.newPin; ls.set("genba-pin", pin); }
    if (body.newCode) { cfg.code = body.newCode; ls.set("genba", cfg); remember(); toast("合言葉を変えました。社員には新しい招待リンクを送ってください", 6000); }
  }
});
async function join(url, code) {
  busy = true; render();
  const prev = cfg;
  try { cfg = { url, code, me: prev.url === url && prev.code === code ? prev.me : undefined }; await api("state"); ls.set("genba", cfg); remember(); }
  catch(x) { cfg = prev.url ? prev : {}; S = null; toast(x.message, 6000); }
  busy = false; render();
}

/* ---------- この端末を覚える ----------
   iPhoneはSafariとホーム画面のアプリで保存場所が別なので、アドレスに「?k=」を付けておき、
   ホーム画面に追加した時もそのまま入れるようにする */
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = t => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));
function remember() {
  if (!cfg.url || !cfg.code) return;
  const k = b64e(cfg.me ? { u: cfg.url, c: cfg.code, m: cfg.me } : { u: cfg.url, c: cfg.code });
  try { history.replaceState(null, "", location.pathname + "?k=" + k + location.hash); } catch(e) {}
}

/* ---------- 起動 ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#task-")) { flashId = h.slice(6); const t = S && S.tasks.find(x => x.id === flashId); tab = t && !pendingOf(t).includes(cfg.me) ? "all" : "mine"; if (t && tab === "all") ui.allFilter = "all"; }
  else if (h === "#clean") { tab = "all"; ui.cat = "掃除"; ui.allFilter = "all"; }
  else if (h === "#board") tab = "board";
  else if (h === "#duty") tab = "duty";
  else if (h === "#mine-tasks") { tab = "mine"; setTimeout(() => { const el = document.getElementById("mine-tasks"); if (el) el.scrollIntoView({ block: "start" }); }, 50); }
  else if (h === "#all") { tab = "all"; }
}
(async function start() {
  const m = location.hash.match(/^#j=([\w-]+)/), q = new URLSearchParams(location.search).get("k");
  const tok = m ? m[1] : q;
  if (m) { try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {} }
  if (tok) {
    try { const j = b64d(tok);
      if (j.u !== cfg.url || j.c !== cfg.code) { await join(j.u, j.c); }
      if (j.m && !cfg.me && cfg.url === j.u) { cfg.me = j.m; ls.set("genba", cfg); }
    } catch(e) { toast("招待リンクが読めませんでした。もう一度開いてください", 5000); }
  }
  if (cfg.url) await refresh(false);
  remember();
  route(); render(); swInit().then(() => diagCheck()).then(render);
  window.addEventListener("hashchange", () => { route(); render(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
  setInterval(() => { if (document.visibilityState === "visible" && !busy && !F && !N && !ui.nudge && !document.activeElement.matches("input,select,textarea")) refresh(true); }, 60000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", ev => { if (ev.data && ev.data.type === "push") { chime(ev.data.alarm); toast(ev.data.title, 4000); refresh(true); return; } if (ev.data && ev.data.url) { history.replaceState(null, "", new URL(ev.data.url).hash || location.pathname); route(); refresh(true); } });
})();
</script>
