<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOGAMI">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script>window.MOGAMI_STANDALONE=true;</script>
<title>MOGAMI PARTNER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-style">
/* Layout: 墨のトップバー + 左ナビ(広幅) / 下部タブ(スマホ)。和紙白の作業面に深緑のアクション。 */
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --sunk:#EEF0EB;
  --ink:#1B1F1D; --ink-2:#4B534E; --muted:#747C77; --line:#DADED6;
  --green:#1F4A3A; --green-solid:#1F4A3A; --on-green:#FFFFFF; --green-soft:#E2EBE5; --green-mid:#5E8C77;
  --sumi:#1B1F1D; --on-sumi:#F2F3EF;
  --amber:#8A5A1F; --amber-soft:#F3E8D7; --red:#A23B2C; --red-soft:#F5E1DC;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101311; --surface:#171B19; --sunk:#1D2220;
  --ink:#E6E9E4; --ink-2:#B6BDB8; --muted:#8B938E; --line:#2B322E;
  --green:#7CC0A0; --green-solid:#3E8463; --on-green:#FFFFFF; --green-soft:#1C2C25; --green-mid:#5E9C80;
  --sumi:#0A0C0B; --on-sumi:#E6E9E4;
  --amber:#DDAA63; --amber-soft:#2D2517; --red:#E8907F; --red-soft:#2E1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101311; --surface:#171B19; --sunk:#1D2220;
  --ink:#E6E9E4; --ink-2:#B6BDB8; --muted:#8B938E; --line:#2B322E;
  --green:#7CC0A0; --green-solid:#3E8463; --on-green:#FFFFFF; --green-soft:#1C2C25; --green-mid:#5E9C80;
  --sumi:#0A0C0B; --on-sumi:#E6E9E4;
  --amber:#DDAA63; --amber-soft:#2D2517; --red:#E8907F; --red-soft:#2E1C19; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sumi)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green-mid);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sumi);color:var(--on-sumi);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.14em}
.brand span{font-size:11px;letter-spacing:.12em;opacity:.7;white-space:nowrap}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.who .role{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}

.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 52px)}
nav.side{display:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;min-width:0;max-width:1080px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs a .k{font-family:var(--f-display);font-size:20px;line-height:1}
nav.tabs a[aria-current="page"]{color:var(--green)}
nav.tabs a[aria-current="page"] .k{color:var(--green)}
@media (min-width:900px){
  .shell{grid-template-columns:220px 1fr}
  nav.side{display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:52px;height:calc(100vh - 52px)}
  nav.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:500}
  nav.side a .k{font-family:var(--f-display);font-size:20px;width:24px;text-align:center;color:var(--muted)}
  nav.side a[aria-current="page"]{background:var(--green-soft);color:var(--green)}
  nav.side a[aria-current="page"] .k{color:var(--green)}
  nav.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 14px}
  nav.tabs{display:none}
  main{padding-block:28px 48px}
}

.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
.pagehead h1{font-size:26px}
.pagehead p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.pagehead .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--green-mid)}
.btn.primary{background:var(--green-solid);border-color:var(--green-solid);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.line{border-color:var(--line);color:var(--ink-2)}
.pill.demo{border:1px dashed var(--amber);color:var(--amber)}

.banner{border-radius:var(--r);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.info{background:var(--green-soft);color:var(--green)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input.i,select.i,textarea.i{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;font-weight:400;color:var(--ink)}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--green-mid)}

/* 診断 */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prog .bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green-solid);border-radius:99px;transition:width .3s}
.prog .n{font-size:13px;color:var(--muted);white-space:nowrap}
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.steps span{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.done{background:var(--green-soft);color:var(--green)}
.steps span.now{background:var(--green-solid);color:var(--on-green)}
.qnum{font-family:var(--f-display);font-size:14px;color:var(--green);letter-spacing:.1em}
.qtitle{font-size:28px;margin:4px 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.opt{min-height:92px;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center}
.opt b{font-size:19px;font-family:var(--f-display)}
.opt small{color:var(--muted);font-size:12px}
.opt:hover{border-color:var(--green-mid)}
.opt[aria-pressed="true"]{border-color:var(--green-solid);background:var(--green-soft)}
.qnav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}

/* 推薦結果 */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rec.first{border:2px solid var(--green-solid)}
.rec .hd{display:flex;gap:12px;align-items:flex-start}
.rank{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.08em}
.rec h3{font-size:19px}
.score{margin-left:auto;text-align:right;line-height:1}
.score b{font-family:var(--f-display);font-size:40px;color:var(--green)}
.score small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:0}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0}
.bd{display:grid;grid-template-columns:7.2em 1fr 3.6em;gap:6px 8px;align-items:center;font-size:12px}
.bd .tr{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bd .tr i{position:absolute;inset:0 auto 0 0;background:var(--green-solid);border-radius:99px}
.bd .tr.unk{background:repeating-linear-gradient(45deg,var(--amber-soft) 0 5px,transparent 5px 10px);outline:1px solid var(--amber);outline-offset:-1px}
.bd .pt{text-align:right;color:var(--ink-2)}
.bd .lb{color:var(--ink-2)}
.list{margin:0;padding-left:1.2em;font-size:13px}
.list li{margin:2px 0}
.list.ng li::marker{color:var(--red)}
.list.good li::marker{color:var(--green)}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none}
.rec .thumb{width:88px;height:88px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk)}
table.t td.num,table.t th.num{text-align:right}
table.t tr:last-child td{border-bottom:none}

/* カード一覧 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-width:0}
.card:hover{border-color:var(--green-mid)}
.card h3{font-size:17px}
.card .sub{font-size:12px;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:18px;display:flex;align-items:center;gap:8px}
.sec>h2 .c{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.log{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.log .e{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.log .e:last-child{border-bottom:none}
.log .e .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log .empty{padding:12px 14px;color:var(--muted);font-size:13px}

/* シミュレーター */
.sim{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.sim>*{min-width:0}
.seg button{min-width:0;overflow:hidden}
@media (min-width:900px){.sim{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.src{display:flex;gap:4px;margin-top:2px}
.src button{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11px;padding:2px 10px;cursor:pointer;color:var(--muted)}
.src button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:24px}
.kpi .d{font-size:12px}
.up{color:var(--green)} .down{color:var(--red)}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .r{display:grid;grid-template-columns:8em 1fr;gap:8px;align-items:center;font-size:12px}
.cmp .bars{display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp .b{height:18px;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:11px;white-space:nowrap;min-width:2px}
.cmp .b.cur{background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.cmp .b.new{background:var(--green-solid);color:var(--on-green)}
.formula{font-size:12px;background:var(--sunk);border-radius:8px;padding:12px 14px;color:var(--ink-2);line-height:1.8}

.gate{max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px}
details.x>summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:58px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button b{font-family:var(--f-display);font-size:18px;line-height:1.1}
.seg button small{font-size:10.5px;line-height:1.2;font-weight:500;text-align:center}
.seg button[aria-checked="true"]{background:var(--green-solid);color:var(--on-green)}
.scale{display:flex;flex-direction:column;gap:6px;font-weight:400}
.scale-foot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}
.sizerow{display:grid;grid-template-columns:3.2em minmax(0,1.6fr) minmax(0,1fr);gap:10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.sizerow .sz{font-family:var(--f-display);font-size:22px;color:var(--green);align-self:center}
@media (max-width:560px){.sizerow{grid-template-columns:3.2em minmax(0,1fr)}.sizerow>div:last-child{grid-column:2}}
.yn{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.yn button{min-height:40px;min-width:3.4em;border:0;background:transparent;font-weight:700;cursor:pointer;color:var(--muted);padding:0 10px}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]:first-child{background:var(--green-solid);color:var(--on-green)}
.yn button[aria-pressed="true"]:last-child{background:var(--red);color:var(--surface)}
.yn button.alt[aria-pressed="true"]{background:var(--green-solid);color:var(--on-green)}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabbar button{min-height:48px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabbar button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green-solid)}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.months button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2)}
.months button[aria-pressed="true"]{background:var(--green-solid);border-color:var(--green-solid);color:var(--on-green)}
.months button:disabled{opacity:.35;cursor:not-allowed}
.seg.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.opt{position:relative}
.opt .chk{position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--on-green);font-size:14px}
.opt[aria-pressed="true"] .chk{background:var(--green-solid);border-color:var(--green-solid)}
.seg.wrap{grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.seg.wrap button{border-right:0;background:var(--surface)}
.seg.wrap button[aria-checked="true"]{background:var(--green-solid);color:var(--on-green)}
tr.dim td{opacity:.55}
.roll{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.roll .btn{min-height:46px;min-width:56px}
.brand b{white-space:nowrap}
@media (max-width:640px){.brand span{display:none}.brand b{font-size:15px;letter-spacing:.08em}.who .nm{display:none}.top{gap:8px}}
.installbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--on-sumi);border-radius:999px;font-size:12px;font-weight:700;padding:4px 10px;min-height:30px;cursor:pointer;white-space:nowrap}
.shopname{border:2px solid var(--green-solid)}
.card.later{border-style:dashed}
.est{background:var(--green-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.est-l{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--green)}
.est-v{font-family:var(--f-display);font-size:26px;line-height:1.2;color:var(--ink)}
.est-v small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.est-s{font-size:14px}
.est-n{font-size:12px;color:var(--muted)}
details.memo{border-top:1px dashed var(--line);padding-top:6px}
details.memo>summary{font-size:12px;color:var(--muted);font-weight:500}
.iconbig{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.iconbig img{width:min(240px,70vw);height:auto;border-radius:22%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.iconbig figcaption{font-size:14px;font-weight:700;color:var(--green)}
.iconprev{width:96px;height:96px;border-radius:22%;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}
.steplist{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steplist li::marker{color:var(--green);font-weight:700}
.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.btn.line:hover{filter:brightness(1.05)}
.lineicon{font-size:10px;font-weight:800;letter-spacing:.02em;background:#fff;color:#06C755;border-radius:5px;padding:1px 4px}
.matrix td,.matrix th{text-align:center!important}
.matrix td:first-child,.matrix th:first-child{text-align:left!important}
/* 表が画面幅に入らないとき（スマホ・iPad縦など）は、1行を1枚のカードにして縦スクロールだけで読めるようにする */
.tablewrap.stacked{overflow:visible;border:0;background:none;border-radius:0}
.tablewrap.stacked table.t{min-width:0!important;display:block}
.tablewrap.stacked tbody{display:block}
.tablewrap.stacked tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 10px;margin-bottom:10px}
.tablewrap.stacked tr.hdr{display:none}
.tablewrap.stacked td{display:block;position:relative;min-height:1.6em;border:0;padding:5px 0 5px min(36%,10em);text-align:left!important;overflow-wrap:anywhere}
.tablewrap.stacked td::before{content:attr(data-label);position:absolute;left:0;top:7px;width:calc(min(36%,10em) - 10px);color:var(--muted);font-size:12px;font-weight:700;line-height:1.4}
.tablewrap.stacked td[data-label=""]{padding-left:0}
.tablewrap.stacked td[data-label=""]::before{display:none}
.tablewrap.stacked td:first-child{display:block;font-weight:700;font-size:15px;padding:4px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tablewrap.stacked td:first-child::before{display:none}
.tablewrap.stacked td:empty{display:none}
.tablewrap.stacked td .row{justify-content:flex-start!important}
.tablewrap.stacked td b{white-space:nowrap}
.tablewrap.stacked td .row>b{min-width:2.8em}
/* タブは折り返して全部見えるように */
.tabbar{flex-wrap:wrap;overflow-x:visible}
.tabbar button{flex:1 1 auto;white-space:normal;line-height:1.35;padding:8px 12px;text-align:center}
/* 印刷・PDF：画面の操作部品を外した「控え」を作って印刷する */
#print-area{display:none}
.pdfsheet{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.35)}
.pdfsheet .panel{max-width:520px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.printval{display:inline-block;min-width:4em;padding:2px 8px;border-bottom:1px solid var(--line);font-weight:700}
.print-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px;font-size:12px}
.print-head b{font-family:var(--f-display);font-size:16px;letter-spacing:.1em}
/* 印刷の控えは詰めて、なるべく1ページに収める */
#print-area{font-size:10.5px;line-height:1.45}
#print-area .print-head{margin-bottom:8px}
#print-area h1{font-size:17px} #print-area h2{font-size:13px} #print-area h3{font-size:12px}
#print-area .pagehead{margin-bottom:4px;gap:4px} #print-area .pagehead p{font-size:10px}
#print-area .stack{gap:6px} #print-area .panel{padding:7px 10px}
#print-area .grid2{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px}

#print-area .printval{padding:0 4px;min-width:0;font-size:11px}
#print-area .recs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#print-area .rec{padding:8px;gap:5px} #print-area .rec h3{font-size:13px}
#print-area .score b{font-size:24px} #print-area .est{padding:6px 8px} #print-area .est-v{font-size:16px} #print-area .est-s{font-size:11px}

#print-area .opts{gap:4px} #print-area .opt{min-height:0;padding:4px 8px}
@media print{
  @page{margin:10mm}
  html.printing body>*:not(#print-area){display:none!important}
  html.printing #print-area{display:block}
  html,body{background:#fff!important;color:#000}
  #print-area .kpi,#print-area .est,#print-area .tablewrap.stacked tr{break-inside:avoid}
  #print-area *{box-shadow:none!important}
}

.qitem .hd{display:flex;align-items:center;gap:8px}
.qitem .hd b{font-family:var(--f-display);color:var(--green)}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.qhint{font-size:12px;color:var(--muted)}
.qhint.bad{color:var(--red);font-weight:700}
.qprev{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.qdoc{background:#fff;color:#111;font-family:var(--f-body);font-size:12px;line-height:1.5;padding:20px}
.qdoc h1{font-family:var(--f-display);font-size:24px;letter-spacing:.5em;text-align:center;margin:0 0 14px;color:#111}
.qd-head{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;margin-bottom:14px}
.qd-to{flex:1 1 300px;min-width:0}

.qd-total{margin-top:10px;border:2px solid #111;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qd-total b{font-size:20px;font-family:var(--f-display)}
.qd-from{flex:0 1 260px;font-size:11px;line-height:1.6}

.qd-meta{font-size:11px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;margin-bottom:8px}
.qdoc table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.qdoc th,.qdoc td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top;color:#111}

/* 実績のグラフ */
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.chart h2{font-size:17px;margin-bottom:2px}
.chart .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.donutwrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.donutwrap svg{width:170px;height:170px;flex:none}
.donutwrap svg path{cursor:pointer;transition:opacity .15s}
.donutwrap svg.focus path:not(.on){opacity:.35}
.lgd{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;margin:0;padding:0;list-style:none}
.lgd li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.lgd li.on{background:var(--sunk)}
.lgd i{width:12px;height:12px;border-radius:3px;display:block}
.lgd b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.lgd small{display:block;color:var(--muted);font-size:11px}
.funnel{display:flex;flex-direction:column;gap:10px}
.fn{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:center;font-size:13px}
.fn .tr{position:relative;height:26px;background:var(--sunk);border-radius:4px}
.fn .tr i{position:absolute;inset:0 auto 0 0;background:var(--green-solid);border-radius:4px;min-width:2px}
.fn .tr span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.fn .tr span.in{color:var(--on-green)}
.fn .cv{grid-column:2;font-size:11px;color:var(--muted);margin-top:-6px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip-row button{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:4px 12px;min-height:32px;cursor:pointer;color:var(--ink-2)}
.chip-row button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag); let val;
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==="class") el.className = v;
    else if (k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2), v);
    else if (k==="style") el.style.cssText = v;
    else if (k==="value") val = v;
    else if (k==="checked"||k==="selected"||k==="disabled") el[k] = !!v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null || c===false) continue; el.append(c instanceof Node ? c : String(c)); }
  if (val!==undefined) el.value = val;
  return el;
}

const normQ = s => String(s??"").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g," ").trim();

  "頭":"あたま","骨":"ほね","短冊":"たんざく","焼":"やき","冷凍":"れいとう","生":"なま","特大":"とくだい","小":"しょう","中":"ちゅう","大":"だい","運賃":"うんちん","付属品":"ふぞくひん","副産物":"ふくさんぶつ","活魚":"かつぎょ","艶鰻":"えんまん","和匠":"わしょう"};
function matchQ(q, ...fields){
  const t = normQ(q); if (!t) return true;
  const raw = fields.flat(Infinity).filter(x=>x!=null).join(" ");
  const hay = normQ(raw + " " + Object.keys(READS).filter(k=>raw.includes(k)).map(k=>READS[k]).join(" "));
  return t.split(" ").every(w=>hay.includes(w));
}

/* 選ぶ欄に検索を付ける。items=[{v:値, l:表示, g:区分, k:検索用の言葉}]。
   言葉を入れると、当てはまる商品がボタンで出る（押すと選べる）。下の選ぶ欄も当てはまるものだけになる */
function searchPick({items, value, onPick, id, empty, placeholder}){
  let q = "";
  const selEl = h("select",{class:"i", id, onchange:e=>onPick(e.target.value)});
  const hits = h("div",{class:"chip-row",style:"margin:0"});
  const hint = h("span",{class:"qhint"});
  const fill = () => {
    const hit = items.filter(x=>matchQ(q, x.l, x.g, x.k));
    const cur = items.find(x=>x.v===value);
    const list = cur && !hit.includes(cur) ? [cur, ...hit] : hit;
    const opt = x => h("option",{value:x.v, selected:x.v===value}, x.l);
    const groups = [...new Set(list.map(x=>x.g||""))];
    const kids = groups.some(Boolean) ? groups.map(g=> g ? h("optgroup",{label:g}, list.filter(x=>(x.g||"")===g).map(opt)) : list.filter(x=>!x.g).map(opt)) : list.map(opt);
    selEl.replaceChildren(h("option",{value:"", selected:!value}, empty||"選んでください"), ...kids.flat());
    const show = q.trim() ? hit.slice(0, 8) : [];
    hits.replaceChildren(...show.map(x=>h("button",{type:"button","aria-pressed":String(x.v===value), onclick:()=>onPick(x.v)}, x.l)));
    hits.hidden = !show.length;
    hint.textContent = !q.trim() ? "" : !hit.length ? "見つかりません。言葉を短くしてみてください" : hit.length > show.length ? hit.length+"件あります（上から8件。言葉を足すとしぼれます）" : "押すと選べます";
    hint.hidden = !hint.textContent;
  };
  fill();
  return h("div",{class:"stack",style:"gap:6px"},
    items.length > 1 ? searchBox(id ? id+"-q" : null, "", placeholder||"名前・産地で検索", v=>{ q = v; fill(); }) : null,
    hits, hint, selEl);
}
async function write(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    const c = e && e.code;
    if (c==="invalid_argument"){ toast("保存できませんでした。この操作の権限がないか、入力内容に問題があります。"); }
    else if (c==="quota_exceeded"){ toast("データ容量の上限に達しました。不要なデータを削除してください。"); }
    else { toast("保存できませんでした。通信状態を確認して、もう一度お試しください。"); }
    console.warn(e); return false;
  }
}

/* 表の自動カード化：見出し行の文字を各セルのラベルにし、横幅に入らない表だけカード表示に切り替える */
function stackTables(){
  const main = document.getElementById("main"); if (!main || !main.querySelectorAll) return;
  main.querySelectorAll(".tablewrap").forEach(w=>{
    const t = w.querySelector("table"); if (!t) return;
    const rows = [...t.rows], hdr = rows.find(r=>r.cells.length && [...r.cells].every(c=>c.tagName==="TH"));
    const labels = hdr ? [...hdr.cells].map(c=>c.textContent.trim()) : [];
    if (hdr) hdr.classList.add("hdr");
    rows.forEach(r=>{ if (r!==hdr) [...r.cells].forEach((c,i)=>{ c.setAttribute("data-label", labels[i]||""); }); });
    w.classList.remove("stacked");
    if (t.scrollWidth > w.clientWidth + 2) w.classList.add("stacked");
  });
}
let stackQueued = false;
const queueStack = () => { if (stackQueued) return; stackQueued = true; requestAnimationFrame(()=>{ stackQueued = false; stackTables(); }); };
try {
  const mainEl = document.getElementById("main");
  if (typeof MutationObserver!=="undefined" && mainEl && mainEl.nodeType===1){
    new MutationObserver(queueStack).observe(mainEl, {childList:true, subtree:true});
    window.addEventListener("resize", queueStack); window.addEventListener("orientationchange", queueStack); mainEl.addEventListener("toggle", queueStack, true);
  }
} catch(e){}

/* ============ 推薦ロジック ============ */
function getWeights(){ const w = (S.weights && S.weights.base) ? S.weights : {};
  return {base:{...DEFAULT_WEIGHTS.base, ...(w.base||{})}, bonus:{...DEFAULT_WEIGHTS.bonus, ...(w.bonus||{})}}; }
/* skip：お客様が答えていない（または「タレは使わない」）項目。0点にして残りで100点に換算 */
function weightsFor(prios, G, skip){
  G = G || getWeights(); const raw = {};
  for (const k of Object.keys(CRIT)) raw[k] = (skip||[]).includes(k) ? 0 : (Number(G.base[k])||0) + (prios.includes(k) ? (Number(G.bonus[k])||0) : 0);
  const tot = sum(raw); const out = {}; if (!tot) return Object.fromEntries(Object.keys(CRIT).map(k=>[k,0]));
  const exact = Object.entries(raw).map(([k,v])=>[k, v/tot*100]);
  exact.forEach(([k,v])=>out[k]=Math.floor(v));
  let rest = 100 - sum(out);
  exact.sort((a,b)=>(b[1]%1)-(a[1]%1)).forEach(([k])=>{ if (rest>0 && raw[k]>0){ out[k]++; rest--; } });
  return out;
}
function ordMatch(v, want){ if (!isNum(v)) return null; const d = Math.abs(Number(v)-Number(want)); return Math.max(0, 1 - d/4); }
function supplyLabel(p){ const s = toNum(p.supply); if (s==null) return ["要確認","warn"]; if (s>=4) return ["安定","ok"]; if (s===3) return ["やや変動","warn"]; return ["不安定","bad"]; }

function recommend(ans, needQty){
  const prios = prioList(ans);
  const W = weightsFor(prios, null, ["oil","tare"].filter(k => !isNum(ans[k])));
  const eligible = [], excluded = [], waiting = [];
  for (const p of S.products){
    const why = []; let stockOut = false;
    const sizes = Array.isArray(p.sizes) ? p.sizes : [];
    if (ans.size!=="any"){
      if (!sizes.length) why.push("サイズ規格が未登録（要確認）");
      else if (!sizes.includes(ans.size)) why.push("希望サイズ "+ans.size+" の取扱なし（取扱："+sizes.join("・")+"）");
    }
    const av = availFor(p, ans.size);
    if (av==null) why.push("在庫の有無が未設定（要確認）"); else if (av===false) stockOut = true, why.push(ans.size!=="any" ? ans.size+"は在庫なし（季節）" : "全サイズ在庫なし（季節）");
    const need = toNum(needQty);
    if (need!=null && need>0){
      const cap = toNum(p.weeklyCap);
      if (cap==null) why.push("納品可能数量が未登録（要確認）");
      else if (cap<need) why.push("納品可能数量が不足（週"+num(cap)+"kg ＜ 必要"+num(need)+"kg）");
    }
    if (why.length) excluded.push({p, why}); else eligible.push(p);
    /* 在庫なし「だけ」が理由の商品は、別枠（在庫が戻ったらおすすめ）用に点数を付ける */
    if (stockOut && why.length===1) waiting.push(p);
  }
  const prices = [...eligible, ...waiting].map(p=>priceBasis(p, ans.size)).filter(v=>v!=null);
  const pmin = Math.min(...prices), pmax = Math.max(...prices);
  const scoreOne = p => {
    const pc = priceBasis(p, ans.size);
    const items = []; let total = 0, unknownPts = 0; const reasons = [], gaps = [], unknown = [];
    const m = {
      supply: isNum(p.supply) ? Number(p.supply)/5 : null,
      quality: isNum(p.quality) ? Number(p.quality)/5 : null,
      flesh: ordMatch(p.flesh, ans.flesh),
      fat: ordMatch(p.fat, ans.fat),
      oil: isNum(ans.oil) ? ordMatch(p.oil, ans.oil) : undefined,
      tare: isNum(ans.tare) ? (p.tareFit==="any" ? 1 : ordMatch(p.tareFit, ans.tare)) : undefined,
      skin: ordMatch(p.skin, ans.skin),
      cook: isNum(p.cookFit?.[ans.cook]) ? Number(p.cookFit[ans.cook])/5 : null,
      price: pc!=null ? (pmax===pmin ? 1 : 1 - (pc-pmin)/(pmax-pmin)*0.7) : null,
      brand: isNum(p.brand) ? Number(p.brand)/5 : null,
      luxury: isNum(p.luxury) ? Number(p.luxury)/5 : null,
      uniform: isNum(p.uniform) ? Number(p.uniform)/5 : null,
      yield: shiroOf(p)!=null ? Math.min(1, Math.max(0, (shiroOf(p)-57.5)/10)) : isNum(p.yield) ? Number(p.yield)/5 : null,
      domestic: domesticOf(p)
    };
    for (const k of Object.keys(CRIT)){
      const w = W[k]||0; if (!w || m[k]===undefined) continue;
      if (m[k]==null){ items.push({k,w,pts:null}); unknownPts += w; unknown.push(CRIT[k]); continue; }
      const pts = Math.round(w*m[k]); total += pts; items.push({k,w,pts});
    }
    // 推薦理由・不一致
    const desc = {fat:[FAT,"味"], oil:[OIL,"脂の強さ"], skin:[SKIN,"皮"], flesh:[FLESH,"身質"]};
    for (const k of ["flesh","fat","oil","skin"]){ if (m[k]===undefined) continue;
      if (m[k]===1) reasons.push(desc[k][1]+"がご希望（"+lbl(desc[k][0],ans[k])+"）と一致");
      else if (m[k]!=null && m[k]>=0.75) reasons.push(desc[k][1]+"がご希望に近い（本品「"+lbl(desc[k][0],p[k])+"」）");
      else if (m[k]!=null) gaps.push(desc[k][1]+"：希望「"+lbl(desc[k][0],ans[k])+"」／本品「"+lbl(desc[k][0],p[k])+"」");
    }
    if (m.tare!=null){
      if (p.tareFit==="any") reasons.push("どのタレにも合わせやすい");
      else if (m.tare>=0.75) reasons.push("お店のタレ（"+lbl(TARE,ans.tare)+"）との相性が良い");
      else if (m.tare<=0.5) gaps.push("タレ：お店は「"+lbl(TARE,ans.tare)+"」／本品は「"+lbl(TARE,p.tareFit)+"」向き");
    }
    if (m.cook!=null){ if (m.cook>=0.8) reasons.push(COOK[ans.cook]+"との相性が高い（"+p.cookFit[ans.cook]+"/5）"); else if (m.cook<=0.4) gaps.push(COOK[ans.cook]+"との相性が低い（"+p.cookFit[ans.cook]+"/5）"); }
    if (m.supply!=null){ if (m.supply>=0.8) reasons.push("供給が安定（"+p.supply+"/5）"); else if (m.supply<=0.4) gaps.push("供給が不安定（"+p.supply+"/5）"); }
    if (m.quality!=null && m.quality>=0.9) reasons.push("品質実績が高い（"+p.quality+"/5）");
    if (prios.includes("yield") && shiroOf(p)!=null){ const y = shiroOf(p), se = seasonOf(p, thisMonth());
      if (y>=64) reasons.push("白焼き歩留まり "+num(y,1)+"%（標準60〜65%の上位"+(se ? "・"+(se.label||"時期別")+"の時期" : "")+"）"); else if (y<=61) gaps.push("白焼き歩留まり "+num(y,1)+"%（標準60〜65%の下位）"); }
    for (const k of ["brand","luxury","uniform"]) if (prios.includes(k) && m[k]!=null){
      if (m[k]>=0.8) reasons.push(CRIT[k]+"が高い（"+p[k]+"/5）"); else if (m[k]<=0.4) gaps.push(CRIT[k]+"が低い（"+p[k]+"/5）"); }
    if (prios.includes("domestic") && m.domestic!=null){ if (m.domestic===1) reasons.push("国産（"+(p.origin||"産地登録あり")+"）"); else gaps.push("国産ではない（"+(p.origin||"産地未登録")+"）"); }
    if (m.price!=null && W.price>0){ if (m.price>=0.85) reasons.push("候補内で価格が安い"); else if (m.price<=0.45) gaps.push("候補内で価格が高め"); }
    return {p, total, items, unknownPts, unknown, reasons, gaps};
  };
  const byScore = (a,b)=> b.total-a.total || a.unknownPts-b.unknownPts;
  const scored = eligible.map(scoreOne).sort(byScore);
  /* 在庫ありの3位より点数が高い（＝在庫があればおすすめに入る）在庫なし商品を、最大3件 */
  const bar = scored.length >= 3 ? scored[2].total : -1;
  const later = waiting.map(scoreOne).filter(r => r.total > bar).sort(byScore).slice(0,3);
  return {top: scored.slice(0,3), others: scored.slice(3), excluded, later, W};
}

/* 登録コードがないとき：「ご提案」「カルテ登録」の文章そのものから読み取る（担当者・電話などは入っていないことがある） */
function parseReadableText(text){
  const L = String(text||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const hi = L.findIndex(x=>x.startsWith("【もがみ うなぎのご提案】") || x.startsWith("【MOGAMI カルテ登録】"));
  if (hi<0) return null;
  const B = L.slice(hi), get = k => { const x = B.find(y=>y.startsWith(k+"：")); return x!=null ? x.slice(k.length+1).trim() : ""; };
  const cond = get("条件"); if (!cond) return null;
  const rev = (arr, v) => { const i = arr.indexOf(v); return i>=0 ? i+1 : undefined; };
  const shop = {name:get("店名"), person:get("担当者"), phone:get("電話"), address:get("住所"), memo:get("メモ")};
  if (!shop.name && B[1] && / 様$/.test(B[1])) shop.name = B[1].replace(/ 様$/,"").trim();
  const A = {}; let kg = null;
  const pre = {"味 ":["fat",FAT], "脂 ":["oil",OIL], "皮 ":["skin",SKIN], "身 ":["flesh",FLESH]};
  cond.split("／").map(x=>x.trim()).forEach(t=>{
    const ck = Object.keys(COOK).find(k=>COOK[k]===t); if (ck){ A.cook = ck; return; }
    if (t.startsWith("タレ ")){ const v = t.slice(3); A.tare = v==="どのタレにも合う" ? "any" : v==="タレは使わない" ? "none" : rev(TARE,v); return; }
    for (const p in pre) if (t.startsWith(p)){ A[pre[p][0]] = rev(pre[p][1], t.slice(p.length)); return; }
    if (t==="サイズおまかせ"){ A.size = "any"; return; }
    if (SIZES.includes(t)){ A.size = t; return; }
    const k = t.match(/^1回\s*([\d.]+)kg$/); if (k) kg = Number(k[1]);
  });
  const ok = get("注文量").match(/([\d.]+)\s*kg/); if (ok) kg = Number(ok[1]);
  if (kg!=null){ const t = getPricing().tiers.find(t=>kg>=t.from && (t.to==null || kg<t.to)); if (t) A.orderKg = String(t.from); }
  const pr = get("重視"); A.priorities = pr && pr!=="特になし" ? pr.split("・").map(x=>Object.keys(PRIORITY).find(k=>PRIORITY[k]===x.trim())).filter(Boolean) : [];
  Object.keys(A).forEach(k=>{ if (A[k]===undefined) delete A[k]; }); A.v = 2;
  const rec = get("おすすめ");
  const names = (rec ? rec.split(/\s+(?=\d+\.\s)/) : B.filter(x=>/^\d+\.\s/.test(x))).map(x=>x.replace(/^\d+\.\s*/,"").trim()).filter(Boolean).slice(0,3);
  const find = nm => S.products.find(p=>String(p.name||"").replace(/【架空】/,"").trim()===nm);
  const top = names.map(nm=>{ const p = find(nm) || find(nm.replace(/（[^（）]*）$/,"").trim()); return {productId:p?p.id:"", name:p?p.name:nm, score:null}; });
  const d = get("診断日"), dt = d ? new Date(d.replace(/-/g,"/")) : null;
  let hs = 0; for (const c of B.join("\n")) hs = (hs*31 + c.codePointAt(0)) >>> 0;
  return {v:1, id:"t"+hs.toString(36), date: dt && !isNaN(dt) ? dt.toISOString() : nowIso(), shop, answers:A, need:"", kg, top, fromText:true};
}
function parseRegText(text){
  const m = String(text||"").match(/MP1:([A-Za-z0-9+\/=\s]+)/);
  const fb = m ? null : parseReadableText(text); if (fb) return fb;
  if (!m) throw new Error("読み取れませんでした。「【MOGAMI カルテ登録】」または「【もがみ うなぎのご提案】」で始まるLINEのメッセージを、最初から最後までコピーして貼り付けてください。");
  let o; try { o = decReg(m[1].replace(/\s+/g,"")); } catch(e){ throw new Error("登録コードが途中で切れています。メッセージを最後までコピーしてください。"); }
  if (!o || o.v!==1 || !o.shop || !o.shop.name) throw new Error("登録コードの形式が正しくありません。");
  return o;
}
/* 顧客カルテに登録：target が null なら新規作成、あれば既存カルテに診断を追加（同じ診断は二重登録しない） */
async function importToCustomer(P, target, by){
  const A = P.answers || {}, who = by || S.uid;
  const entry = {id:P.id, date:P.date, by:who, answers:A, need:P.need||"", kg:P.kg??null, top:P.top||[]};
  const memoLog = P.shop.memo ? [{id:rid(), date:P.date.slice(0,10), by:who, createdAt:nowIso(), kind:"その他", text:"診断時メモ："+P.shop.memo}] : [];
  if (!target){
    const ref = S.db.collection("customers").doc();
    const ok = await write(()=>ref.set({name:P.shop.name, contactPerson:P.shop.person||"", phone:P.shop.phone||"", email:"", address:P.shop.address||"", cook:A.cook||"", preference:"",
      size: A.size && A.size!=="any" ? A.size : "", priceBand:"", nextAction:"", nextDue:"",
      diagnoses:[entry], trades:[], tastings:[], claims:[], contacts:memoLog, sims:[], createdAt:nowIso(), createdBy:S.uid, updatedAt:nowIso()}), P.shop.name+" を顧客カルテに登録しました");
    if (ok){ S.diag.customerId = ref.id; S.imp = null; }
    return ok ? ref.id : null;
  }
  if ((target.diagnoses||[]).some(d=>d.id===entry.id)){ toast("この診断はすでに登録されています"); return target.id; }
  const upd = {diagnoses:[entry, ...(target.diagnoses||[])].slice(0,30), updatedAt:nowIso()};
  if (!target.contactPerson && P.shop.person) upd.contactPerson = P.shop.person;
  if (!target.phone && P.shop.phone) upd.phone = P.shop.phone;
  if (!target.address && P.shop.address) upd.address = P.shop.address;
  if (memoLog.length) upd.contacts = [...memoLog, ...(target.contacts||[])].slice(0,200);
  const ok = await write(()=>S.db.doc("customers/"+target.id).update(upd), target.name+" のカルテに診断を追加しました");
  if (ok) S.imp = null;
  return ok ? target.id : null;
}

    im.onload = () => { try { const r = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth*r), hh = Math.round(im.naturalHeight*r);

    im.onerror = () => { URL.revokeObjectURL(u); ng(new Error("画像を読めません")); }; im.src = u; });

function calcSim(s){
  const g = k => toNum(s[k].v);
  const P = Number(String(s.size.v).replace("P","")) || null;
  const kgPerMeal = (P && g("fishPerMeal")!=null) ? g("fishPerMeal")/P : null;
  /* ロスは含めない：1食原価 ＝ 仕入単価 × 1食の使用量（尾数 ÷ P） */
  const costPerMeal = price => (price!=null && kgPerMeal!=null) ? price*kgPerMeal : null;
  const cur = costPerMeal(g("curPrice")), nw = costPerMeal(g("newPrice"));
  const curMonthly = g("curPrice")!=null && g("monthlyKg")!=null ? g("curPrice")*g("monthlyKg") : null;
  const newMonthly = g("newPrice")!=null && g("monthlyKg")!=null ? g("newPrice")*g("monthlyKg") : null;
  const curProfit = (cur!=null && g("sellPrice")!=null && g("meals")!=null) ? (g("sellPrice")-cur)*g("meals") : null;
  const newProfit = (nw!=null && g("sellPrice")!=null && g("meals")!=null) ? (g("sellPrice")-nw)*g("meals") : null;
  const needKg = (kgPerMeal!=null && g("meals")!=null) ? kgPerMeal*g("meals") : null;
  const estimated = Object.values(s).some(x=>x.src==="est");
  return {P, kgPerMeal, cur, nw, curMonthly, newMonthly, curProfit, newProfit, monthlyDiff: (curProfit!=null&&newProfit!=null)? newProfit-curProfit : null, needKg, estimated,
    curRate: (cur!=null&&g("sellPrice"))? cur/g("sellPrice")*100 : null, newRate: (nw!=null&&g("sellPrice"))? nw/g("sellPrice")*100 : null};
}

function juCalc(j){
  const price = toNum(j.price), fish = fishVal(j.fish), other = toNum(j.other) ?? 0, target = toNum(j.target);
  const t = tierFor(j.kg) || getPricing().tiers[0];
  const sizes = j.size==="all" ? SIZES : [j.size];
  const gram = j.mode==="gram" ? toNum(j.gram) : null;
  /* 1食の使用尾数：尾数指定ならそのまま、グラム指定なら 白焼きg ÷（1尾の重さ × 白焼き歩留まり） */
  const fishFor = (P, y) => gram!=null ? gram / (1000/P * y/100) : fish;
  const eel = (kgPrice, P, fN) => kgPrice * fN / P;   // ロスは含めない
  const rows = [];
  for (const p of S.products) for (const sz of sizes){
    if (!(p.sizes||[]).includes(sz)) continue;
    const P = pOf(sz), q = sellQuote(p, sz, t), av = sizeAvail(p, sz);
    const mo = Number(j.month)||thisMonth(), se = seasonOf(p, mo), yv = shiroOf(p, mo);
    const y = yv ?? SHIRO_DEFAULT, yEst = yv==null, fN = fishFor(P, y), shiroG = 1000/P * fN * y/100;
    const ys = {y, se};
    if (!q){ rows.push({p, sz, av, q:null, fN, shiroG, yEst, ...ys}); continue; }
    const eLo = eel(q.lo,P,fN), eHi = eel(q.hi,P,fN);
    rows.push({p, sz, av, q, fN, shiroG, yEst, ...ys, eLo, eHi, tLo:eLo+other, tHi:eHi+other, rLo:(eLo+other)/price*100, rHi:(eHi+other)/price*100});
  }
  rows.sort((a,b)=> (a.av===false)-(b.av===false) || (a.q?0:1)-(b.q?0:1) || (a.rLo??0)-(b.rLo??0));
  const allow = target!=null ? price*target/100 - other : null;
  const maxKg = Object.fromEntries(SIZES.map(sz=>[sz, allow!=null ? allow*pOf(sz)/fishFor(pOf(sz), SHIRO_DEFAULT) : null]));
  return {price, fish: gram!=null ? gram : fish, gram, other, target, t, rows, allow, maxKg};
}

async function savePdf(custom){

    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait"});
    const M = 10, W = 210 - M*2, H = 297 - M*2, pxPerMm = canvas.width / W, pageHpx = Math.floor(H * pxPerMm);

}

function guestify(){
  if (!PUB) return false;
  S.guest = true; S.conn = "ok"; S.customers = [];
  S.products = (PUB.products||[]).map(x=>({...x}));
  S.pricing = {targetMargin:20, maxKg:PUB.pricing?.maxKg ?? 20, tiers:(PUB.pricing?.tiers||DEFAULT_PRICING.tiers).map(t=>({from:t.from, to:t.to, low:0, high:0}))};
  S.weights = PUB.weights || null;
  if (!["diagnose","simulator","record","quote","share"].includes(S.route)) S.route = "diagnose";
  return true;
}
/* 仕入原価・上乗せ額・顧客情報・特記事項は入れない。販売単価は発注量の段階ごとに計算済みの値だけ */
function buildSnapshot(){
  const T = getPricing().tiers;
  const products = S.products.map(p=>{
    const sizes = p.sizes||[];
    const d = domesticOf(p);
    return {id:p.id, name:p.name, origin:p.origin||"", sizes, demo:!!p.demo,
      fat:p.fat??null, oil:p.oil??null, skin:p.skin??null, tareFit:p.tareFit??null, flesh:p.flesh??null, cookFit:p.cookFit||{}, supply:p.supply??null, quality:p.quality??null,
      brand:p.brand??null, luxury:p.luxury??null, uniform:p.uniform??null, domestic: d===1 ? true : d===0 ? false : null,
      sakiYield:p.sakiYield??null, shiroYield:p.shiroYield??null, seasonYield:p.seasonYield||[], weeklyCap:p.weeklyCap??null, v:2,
      bySize:Object.fromEntries(sizes.map(s=>[s,{avail:sizeAvail(p,s)}])),
      _sell:Object.fromEntries(sizes.map(s=>[s, T.map(t=>{ const q = quote(sizeCost(p,s), t); return q ? {lo:q.lo, hi:q.hi} : null; })])),
      ...(p.img ? {img:p.img} : {})};
  });
  const P = getPricing();
  return {v:1, products, pricing:{maxKg:P.maxKg, tiers:P.tiers.map(t=>({from:t.from, to:t.to??null}))}, weights:getWeights(), extras:{items:getExtras().map(x=>({id:x.id, name:x.name, unit:x.unit, price:x.price, tax:x.tax, cat:extraCat(x)})), ship:getShip()}};
}

async function fireSync(){
  const mcp = await claude.use("mcp");
  if (!mcp) return {ok:false, msg:"この画面からは社員用アプリを更新できません。claude.aiのアプリかサイトで開いてください。"};
  try { await mcp.callTool(MCP_SERVER, "fire_trigger", {trigger_id:SYNC_TRIGGER, text:"社長がアプリの「今すぐ反映」ボタンから依頼しました。"}); return {ok:true}; }
  catch(e){ const c = e && e.code;
    if (c==="needs_reauth") return {ok:false, msg:"「Claude Code Remote」の接続が切れています。claude.aiの設定 → コネクタで再接続してから、もう一度押してください。"};
    if (c==="server_not_connected" || c==="server_not_found" || c==="selection_required") return {ok:false, msg:"「Claude Code Remote」が使えない状態です。claude.aiの設定 → コネクタを確認してから、もう一度押してください。"};
    if (c==="not_in_manifest" || c==="approval_required" || c==="consent_required") return {ok:false, msg:"接続の許可が必要です。もう一度押して、出てきた確認で「許可」を選んでください。"};
    if (c==="not_granted" || c==="capability_disabled" || c==="capability_removed") return {ok:false, msg:"この画面からは社員用アプリを更新できません。claude.aiのアプリかサイトで開いてください。"};
    if (c==="tool_error") return {ok:false, msg:"更新を始められませんでした（"+(e.message||"エラー")+"）。"};
    if (c==="server_unavailable" || c==="upstream_error") return {ok:false, msg:"更新が始まったか確認できませんでした。数分後に社員用アプリを確認してください（もう一度押しても問題ありません）。"};
    return {ok:false, msg:"社員用アプリを更新できませんでした（"+(c||"不明なエラー")+"）。"}; }
}
/* 進み具合：自動更新タスクの最終実行を20秒ごとに確認（最大8分）。読めなければ目安だけ表示 */
async function pollSync(){
  const st = ssGet("mp-sync"); if (!st || S.syncPolling) return;
  if (Date.now() - st.at > 8*60*1000){ ssSet("mp-sync", null); return; }
  S.syncPolling = true;
  const mcp = await claude.use("mcp");
  const done = msg => { S.syncPolling = false; S.syncMsg = msg; ssSet("mp-sync", null); scheduleRender(); };
  if (!mcp){ return done({kind:"info", text:"社員用アプリの更新を始めました。2〜3分で反映されます。"}); }
  const tick = async () => {
    if (Date.now() - st.at > 8*60*1000) return done({kind:"warn", text:"更新の完了を確認できませんでした。社員用アプリを開いて確認してください。"});
    let p; try { p = (await mcp.callTool(MCP_SERVER, "list_triggers", {})).payload; } catch(e){ return done({kind:"info", text:"社員用アプリの更新を始めました。2〜3分で反映されます。"}); }
    if (typeof p==="string"){ try { p = JSON.parse(p); } catch(e){ p = null; } }
    const list = Array.isArray(p) ? p : (p && (p.data || p.triggers)) || [];
    const t = list.find(x => x && x.id===SYNC_TRIGGER), lr = t && t.last_run;
    if (!t) return done({kind:"info", text:"社員用アプリの更新を始めました。2〜3分で反映されます。"});
    const fired = lr && Date.parse(lr.fired_at||"");
    if (fired && fired >= st.at - 60*1000 && lr.finished_at){
      if (/SUCCEEDED/.test(lr.status||"")) return done({kind:"ok", text:"社員用アプリへの反映が終わりました（"+new Date(lr.finished_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"）。開き直すと新しい内容になります。"});
      return done({kind:"warn", text:"社員用アプリの更新がうまくいきませんでした。もう一度押すか、Claudeに「今すぐ更新して」と頼んでください。"});
    }
    S.syncMsg = {kind:"info", text:"社員用アプリに反映しています…（2〜3分かかります）"}; scheduleRender();
    setTimeout(tick, 20000);
  };
  tick();
}
async function reflectNow(){
  if (S.publishing) return;
  S.publishing = true; S.syncMsg = {kind:"info", text:"社員用アプリの更新を始めています…"}; render();
  const r = await fireSync();
  if (r.ok) ssSet("mp-sync", {at:Date.now()});
  else S.syncMsg = {kind:"warn", text:r.msg};
  /* claude.ai版の共有ページも古ければ作り直す（ページが読み込み直され、続きは pollSync が引き継ぐ） */
  if (r.ok && snapStale() && APP_JS){
    const art = await claude.use("artifact");
    if (art){
      try { await art.publish(buildPageHtml({...buildSnapshot(), builtAt:nowIso()})); return; }
      catch(e){ /* claude.ai版の更新に失敗しても、社員用アプリの更新は進んでいる */ }
    }
  }
  S.publishing = false; render();
  if (r.ok) pollSync();
}
function ownerSnapNotice(){
  if (!S.isOwner || S.guest || STANDALONE) return "";
  const stale = snapStale(), m = S.syncMsg;
  const always = ["products","share"].includes(S.route);
  if (!always && !stale && !m) return "";
  if (!["products","share","diagnose","simulator"].includes(S.route)) return "";
  const kind = m ? (m.kind==="ok" ? "info" : m.kind) : (stale ? "warn" : "info");
  return h("div",{class:"banner "+kind,style:"margin-bottom:14px;align-items:center;flex-wrap:wrap"},
    h("div",{style:"flex:1;min-width:220px"},
      h("b",null,"社員用アプリへの反映"), h("br"),
      m ? m.text : (stale ? "商品マスタの変更が、まだ社員用アプリに反映されていない可能性があります。" : "商品マスタを変えたら、ここから今すぐ反映できます。"),
      m ? null : h("span",{class:"small muted",style:"display:block;margin-top:2px"},"押さなくても、毎日 "+SYNC_TIMES+" に自動で反映されます。")),
    h("button",{class:"btn sm primary", disabled:!!(S.publishing || S.syncPolling), onclick:reflectNow}, (S.publishing || S.syncPolling) ? "反映中…" : "今すぐ反映する"));
}

async function ownerStaffCode(){

  if (!master) throw new Error("鍵が見つかりません");
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(master), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const h = new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode("mogami-staff:v"+STAFF_KEY.v)));

      if (got) out.push(got);
      i = t.indexOf('{"v":1', i+1);
    }
  }
  return out;
}
async function resLoad(){

}
/* 粗利を成約時点の原価で固定する（まだ固定していない成約だけ、いまの原価で計算して保存） */

    return "M"+x0+" "+y0+" A"+R+" "+R+" 0 "+big+" 1 "+x1+" "+y1+" L"+x2+" "+y2+" A"+r0+" "+r0+" 0 "+big+" 0 "+x3+" "+y3+" Z"; };
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS,"svg");

/* ============ 新しい版の確認（独立版） ============ */
/* 公開ページはスマホに最大10分、開きっぱなしなら何時間でも古いまま残る。商品・単価（1日4回の自動更新）や画面の直しが
   届いていないと古い単価の見積書が出てしまうので、開いた時・戻ってきた時・30分ごとに、公開中の版と見比べる。 */
const VER_PUB_TEXT = (()=>{ try { return document.getElementById("pub-data").textContent; } catch(e){ return ""; } })();
const VER_MARK = "/* ============ ページ自身の再発行用";
function verParts(html){
  const pm = html.match(/<script id="pub-data" type="application\/json">([\s\S]*?)<\/script>/);
  const i = html.indexOf(VER_MARK), j = i >= 0 ? html.indexOf("</"+"script>", i) : -1;
  return {pub: pm ? pm[1] : null, app: i >= 0 && j > i ? html.slice(i, j) : null};
}
/* 公開中のページ（html）が、いま動いている版と違えば true */
function verCompare(html){
  const v = verParts(String(html||""));
  if (v.pub==null || v.app==null) return false;   // 読めない時は「新しい版あり」にしない
  const runApp = String(APP_JS||"").slice(String(APP_JS||"").indexOf(VER_MARK));
  return v.pub.trim()!==VER_PUB_TEXT.trim() || v.app.trim()!==runApp.trim();
}
let verBusy = false, verLast = 0;
async function verCheck(){
  if (!STANDALONE || verBusy || !navigator.onLine) return false;
  verBusy = true;
  try {
    const r = await fetch(location.pathname+"?check="+Date.now(), {cache:"no-store"});
    if (!r.ok) return false;
    const fresh = verCompare(await r.text());
    verLast = Date.now();
    if (fresh!==!!S.newVersion){ S.newVersion = fresh; scheduleRender(); }
    return fresh;
  } catch(e){ return false; } finally { verBusy = false; }
}
async function verUpdate(){
  toast("新しい版を読み込んでいます…");
  try { await fetch(location.pathname, {cache:"reload"}); } catch(e){}
  location.replace(location.pathname+"?u="+Date.now()+(S.route ? "#"+S.route : ""));
}

    h("button",{class:"btn primary sm", onclick:verUpdate},"更新する"));
}
if (STANDALONE){
  try {
    if (/[?&]u=\d+/.test(location.search)) history.replaceState(null, "", location.pathname+location.hash);
    setTimeout(verCheck, 2500);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && Date.now()-verLast > 60000) verCheck(); });
    window.addEventListener("online", ()=>verCheck());
    setInterval(()=>{ if (document.visibilityState==="visible") verCheck(); }, 30*60*1000);
  } catch(e){}
}

  const totalKg = q.items.reduce((a,it)=>a+qtKg(it),0);
  const tier = tierFor(totalKg) || getPricing().tiers[0];
  const lines = [], disc = []; let base8 = 0, base10 = 0, missing = 0;
  for (const it of q.items){
    const P = pOf(it.size), kg = qtKg(it), rq = qtRule(it, tier), [k, label, fee] = procOf(it.kind);
    const price = isNum(it.price) ? Number(it.price) : (rq ? rq.hi : null);
    if (!it.product || !it.size || !kg || price==null){ if (it.product || it.qty) missing++; continue; }
    if (rq && price < rq.lo) disc.push({product:it.product, size:it.size, kind:k, price, rule:rq.lo});
    const nm = it.product+" "+it.size;
    if (k==="shiro"){
      const per = ceil50((price+fee)/P), n = Number(it.qty), amt = per*n, eel = Math.round(price*kg), pc = amt-eel;
      lines.push({name:nm+" 白焼", qty:n, unit:"枚", up:per, amount:amt, rate:"8%・10%", parts:[{l:"うち うなぎ代（活鰻 "+num(kg,2).replace(/\.?0+$/,"")+"kg × "+yen(price)+"）", amount:eel, rate:"8%"}, {l:"うち 白焼加工賃", amount:pc, rate:"10%"}]});

    if (price < Number(m.price)) disc.push({product:m.name, size:"-", kind:"extra", price, rule:Number(m.price)});

/* 承認：社長の署名を確かめる */
async function aprVerify(code){
  const [a, b] = String(code).trim().split(".");
  if (!a || !b) throw new Error("形が違います");
  const key = await crypto.subtle.importKey("jwk", APR_PUB, {name:"ECDSA", namedCurve:"P-256"}, false, ["verify"]);
  const ok = await crypto.subtle.verify({name:"ECDSA", hash:"SHA-256"}, key, b64uDec(b), new TextEncoder().encode(a));
  if (!ok) throw new Error("署名が違います");
  const o = jDec(a); if (o.t!=="apr" || !o.no) throw new Error("承認の形が違います");
  return o;
}
function qtApproval(q, c){
  if (!c.disc.length) return {need:false};
  if (S.isOwner) return {need:true, ok:true, by:"社長"};
  const a = lsGet(QT_APR, {})[q.no];
  if (!a || a.shop!==q.shop.trim()) return {need:true, ok:false};
  const ok = c.disc.every(d=>a.items.some(x=>x.product===d.product && x.size===d.size && x.kind===d.kind && Number(x.price) <= d.price));
  return {need:true, ok, by:a.by||"社長", at:a.at};
}

    if (ok){ toast("保存しました。社員の画面には次の自動更新（1日4回）で届きます"); S.exDraft = null; render(); }

  const cell = (o, k, type, ph) => h("input",{class:"i", type:type||"text", inputmode:type==="number"?"numeric":null, placeholder:ph||null, value:o[k]??"", oninput:e=>{ o[k] = e.target.value; }});

  return h("section",{class:"stack"},

    E.items.map((x,i)=>h("div",{class:"qitem"},
      h("div",{class:"hd"}, h("b",null, x.name || "新しい商品"), h("button",{class:"linkbtn", style:"margin-left:auto", onclick:()=>{ E.items.splice(i,1); render(); }},"消す")),
      h("div",{class:"grid2"},
        field("品名", cell(x,"name","text","例：肝吸いセット")), field("区分", sel2(x,"cat", EXTRA_CATS.map(c=>[c,c]))),
        field("単位", cell(x,"unit","text","例：串・kg・P・束")), field("販売単価（円・税抜）", cell(x,"price","number")),
        field("税率", sel2(x,"tax", [[8,"8%（食品）"],[10,"10%（食品以外）"]])),
        showCost ? field("原価（円・税抜・任意）", cell(x,"cost","number"), "値引きの承認で粗利率を見るのに使います") : null))),
    h("div",null, h("button",{class:"btn", onclick:()=>{ E.items.push({id:rid(), name:"", unit:"", price:"", tax:8, cat:"その他", cost:""}); render(); }},"＋ 商品を追加")),
    h("div",{class:"qitem"}, h("b",null,"運賃（宅配便のとき）"), h("div",{class:"grid2"},
      field("1個口の単価（円・税抜）", cell(E.ship,"price","number")), field("この量（活鰻kg）未満で運賃をつける", cell(E.ship,"underKg","number")),
      field("税率", sel2(E.ship,"tax", [[10,"10%"],[8,"8%"]])))),
    h("div",{class:"row"}, h("button",{class:"btn primary", onclick:save},"保存する"), h("button",{class:"btn ghost", onclick:()=>{ S.exDraft = null; render(); }},"やめる")));
}
/* ============ 値引きの承認（社長だけ） ============ */
function aprOwnerPanel(){
  const A = S.apr || (S.apr = {text:"", req:null, reply:"", err:""});
  const parse = () => { const m = A.text.match(/MOGAMI-REQ:\s*([A-Za-z0-9_\-]+)/); A.reply = ""; A.err = ""; A.req = null;
    if (!m){ A.err = "依頼の文字が見つかりません。社員から届いた文章をそのまま全部貼り付けてください。"; return render(); }
    try { A.req = jDec(m[1]); if (A.req.t!=="req") throw 0; } catch(e){ A.err = "依頼の文章が壊れています。社員に送り直してもらってください。"; } render(); };
  const approve = async () => {
    try {
      const d = await S.db.collection("data/users/"+S.uid).doc("apr_key").get();
      if (!d.exists) throw new Error("承認の鍵が見つかりません");
      const key = await crypto.subtle.importKey("jwk", d.data().jwk, {name:"ECDSA", namedCurve:"P-256"}, false, ["sign"]);
      const body = jEnc({t:"apr", no:A.req.no, shop:A.req.shop, items:A.req.items.map(x=>({product:x.product, size:x.size, kind:x.kind, price:x.price})), by:"社長", at:nowIso()});
      const sig = b64uEnc(new Uint8Array(await crypto.subtle.sign({name:"ECDSA", hash:"SHA-256"}, key, new TextEncoder().encode(body))));
      const code = body+"."+sig;
      A.reply = "【値引き承認】見積番号 "+A.req.no+"（"+A.req.shop+"）の値引きを承認しました。\n\n① この文章を長押しして、全部コピー\n② いつものアプリ（MOGAMI PARTNER）の「見積書」で「コピーした承認を読み込む」を押す\n\nMOGAMI-APR:"+code;
      render();
    } catch(e){ toast("承認できませんでした（"+e.message+"）"); }
  };
  const r = A.req;
  return h("section",{class:"panel stack",style:"border:2px solid var(--green-solid)"},
    h("h2",{style:"font-size:18px"},"値引きの承認（社長用）"),
    h("p",{class:"small muted",style:"margin:0"},"社員から届いた「値引き承認のお願い」を貼り付けると、原価と粗利を見て承認できます。"),
    h("textarea",{class:"i", id:"apr-in", placeholder:"社員から届いた文章をそのまま全部貼り付け", value:A.text, oninput:e=>{ A.text = e.target.value; }}),
    h("div",null, h("button",{class:"btn sm", onclick:()=>{ A.text = document.getElementById("apr-in").value; parse(); }},"内容を確認する")),
    A.err ? h("div",{class:"banner warn"}, h("div",null,A.err)) : null,
    r ? h("div",{class:"stack"},
      h("div",{class:"small"}, "見積番号 "+r.no+"　／　"+r.shop+"　／　担当 "+r.by+"　／　約"+r.kg+"kg"),
      h("div",{class:"tablewrap"}, h("table",{class:"t"}, h("tr",null, ["商品","標準","希望","原価","粗利率"].map((t,i)=>h("th",{class:i?"num":null},t))),
        r.items.map(x=>{ const p = S.products.find(y=>y.name===x.product), c = p ? sizeCost(p, x.size) : null, m = c!=null && x.price ? (x.price-c)/x.price*100 : null;
          if (x.kind==="ship") return h("tr",null, h("td",null,"運賃をなしにする"), h("td",{class:"num"}, yen(x.rule)), h("td",{class:"num"}, h("b",null,yen(x.price))), h("td",{class:"num"},"—"), h("td",{class:"num"},"—"));
          if (x.kind==="extra"){ const m0 = getExtras().find(e=>e.name===x.product), c0 = m0 ? toNum(S.extrasCost?.map?.[m0.id]) : null, g0 = c0!=null && x.price ? (x.price-c0)/x.price*100 : null;
            return h("tr",null, h("td",null, x.product), h("td",{class:"num"}, yen(x.rule)), h("td",{class:"num"}, h("b",null,yen(x.price))), h("td",{class:"num"}, c0==null ? "—" : yen(c0)),
              h("td",{class:"num"}, g0==null ? "—" : h("span",{class:"pill "+(g0>=getPricing().targetMargin ? "ok" : g0>=getPricing().targetMargin*0.5 ? "warn" : "bad")}, num(g0,1)+"%"))); }
          return h("tr",null, h("td",null, x.product+" "+x.size+"（"+procOf(x.kind)[1]+"）"), h("td",{class:"num"}, yen(x.rule)), h("td",{class:"num"}, h("b",null,yen(x.price))), h("td",{class:"num"}, yen(c)),
            h("td",{class:"num"}, m==null ? "—" : h("span",{class:"pill "+(m>=getPricing().targetMargin ? "ok" : m>=getPricing().targetMargin*0.5 ? "warn" : "bad")}, num(m,1)+"%"))); }))),
      A.reply ? h("div",{class:"stack"}, h("div",{class:"banner info"}, h("div",null,"承認しました。担当者にLINEで送ってください。")), h("div",{class:"row"}, lineButton(A.reply, "担当者にLINEで送る"), copyButton(A.reply, "文章をコピー")))
        : h("div",{class:"row"}, h("button",{class:"btn primary", onclick:approve},"この値引きを承認する"), h("button",{class:"btn ghost", onclick:()=>{ S.apr = null; render(); }},"承認しない（閉じる）"))) : null);
}

/* ============ 合言葉（商品・価格データは暗号化して公開し、合言葉を入れた人だけが読める） ============ */
const PASS_KEY = "mogami.pass";
const normPass = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[^a-z0-9]/g,"");
const b64u8 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptPub(env, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64u8(env.salt), iterations:env.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64u8(env.iv)}, key, b64u8(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlockPub(){
  const env = PUB; let fromUrl = "";
  try { const m = location.hash.match(/^#k=([^&]+)/); if (m){ fromUrl = decodeURIComponent(m[1]); history.replaceState(null,"",location.pathname); } } catch(e){}
  let saved = ""; try { saved = localStorage.getItem(PASS_KEY) || ""; } catch(e){}
  for (const p of [fromUrl, saved]) if (p){ try { PUB = await decryptPub(env, p); try { localStorage.setItem(PASS_KEY, p); } catch(e){} return; } catch(e){} }
  if (saved){ try { localStorage.removeItem(PASS_KEY); } catch(e){} }
  await new Promise(done=>{
    const main = document.getElementById("main");
    const inp = h("input",{class:"i", id:"pass", type:"password", autocomplete:"current-password", autocapitalize:"off", placeholder:"合言葉"});
    const msg = h("p",{class:"small",style:"margin:0;color:var(--red)"}, saved ? "合言葉が変わりました。社長から届いた新しい合言葉を入れてください。" : "");
    const btn = h("button",{class:"btn primary", type:"submit"},"開く");
    const form = h("form",{class:"panel stack", onsubmit:async e=>{ e.preventDefault(); btn.disabled = true; msg.textContent = "";
      try { PUB = await decryptPub(env, inp.value); try { localStorage.setItem(PASS_KEY, inp.value); } catch(e){} done(); }
      catch(err){ msg.textContent = "合言葉が違います。社長から届いたLINEを確認してください。"; btn.disabled = false; inp.select(); } }},
      field("合言葉", inp), msg, btn);
    main.replaceChildren(h("div",{class:"gate"}, h("p",{class:"eyebrow"},"MOGAMI PARTNER"), h("h1",null,"合言葉を入れてください"),
      h("p",{class:"muted"},"株式会社もがみの社員・お取引先さま専用です。合言葉は社長からLINEでお知らせしています。一度入れると、この端末では次から入力不要です（合言葉は毎月はじめに変わります）。"), form));
    inp.focus();
  });
}

(async function boot(){
  if (PUB && PUB.enc) await unlockPub();
  try { const hh = location.hash.replace("#",""); if (ROUTES.some(r=>r.id===hh)) S.route = hh; } catch(e){}
  if (!window.claude || !window.claude.use){ S.conn = "nodb"; guestify(); render(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  claude.use("assets").then(a=>{ S.assets = a; });
  claude.use("downloads").then(d=>{ S.downloads = d; });
  S.db = db; S.user = user;
  if (!db){ S.conn = "nodb"; guestify(); render(); return; }
  S.uid = user ? await user.id() : null;
  S.isOwner = user ? await user.isOwner() : false;
  const cw = user ? await user.can("data.write") : null;
  if (cw===false) S.readOnly = true;
  S.conn = "ok";
  if (!S.uid){ guestify(); render(); return; }
  if (!S.isOwner && cw===false) guestify();
  const onErr = e => { console.warn(e); if (e && e.code==="revoked"){ S.conn="nodb"; render(); } };
  let subs = [];
  function startData(){
    if (subs.length) return;
    subs.push(db.collection("staff").onSnapshot(q=>{ const m={}; q.docs.forEach(d=>m[d.id]=d.data()); S.staff=m; scheduleRender(); }, onErr));
    subs.push(db.collection("products").onSnapshot(q=>{ S.products = q.docs.map(d=>({id:d.id, ...normScale(d.data())})).sort((a,b)=>(a.demo?1:0)-(b.demo?1:0) || String(a.name).localeCompare(String(b.name),"ja")); scheduleRender(); }, onErr));
    subs.push(db.collection("customers").onSnapshot(q=>{ S.customers = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")); scheduleRender(); }, onErr));
    subs.push(db.doc("settings/pricing").onSnapshot(d=>{ S.pricing = d.exists ? d.data() : null; if (!(document.activeElement && String(document.activeElement.id).startsWith("pr-"))) S.pDraft = null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/extras").onSnapshot(d=>{ S.extras = d.exists ? d.data() : null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/extras_cost").onSnapshot(d=>{ S.extrasCost = d.exists ? d.data() : null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/weights").onSnapshot(d=>{ S.weights = d.exists ? d.data() : null; if (!S.wDraft || !document.activeElement || !String(document.activeElement.id).startsWith("w-")) S.wDraft = null; scheduleRender(); }, onErr));
    if (S.isOwner) subs.push(db.collection("access_requests").onSnapshot(q=>{ S.requests = q.docs.map(d=>({id:d.id, ...d.data()})); scheduleRender(); }, onErr));
  }
  db.doc("staff/"+S.uid).onSnapshot(d=>{ S.myStaff = d.exists ? d.data() : null; if (role()) startData(); scheduleRender(); }, onErr);
  if (!S.isOwner) db.doc("access_requests/"+S.uid).onSnapshot(d=>{ S.myReq = d.exists ? d.data() : null; scheduleRender(); }, onErr);
  if (S.isOwner) startData();
  render();
  if (S.isOwner && ssGet("mp-sync")) pollSync();
})();
