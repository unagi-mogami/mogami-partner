/* ============ 合言葉（商品・価格データは暗号化して公開し、合言葉を入れた人だけが読める） ============ */
const PASS_KEY = "mogami.pass";
const normPass = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[^a-z0-9]/g,"");
const b64u8 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptPub(env, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64u8(env.salt), iterations:env.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64u8(env.iv)}, key, b64u8(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlockPub(){
  const env = PUB; let fromUrl = "";
  try { const m = location.hash.match(/^#k=([^&]+)/); if (m){ fromUrl = decodeURIComponent(m[1]); history.replaceState(null,"",location.pathname); } } catch(e){}
  let saved = ""; try { saved = localStorage.getItem(PASS_KEY) || ""; } catch(e){}
  for (const p of [fromUrl, saved]) if (p){ try { PUB = await decryptPub(env, p); try { localStorage.setItem(PASS_KEY, p); } catch(e){} return; } catch(e){} }
  if (saved){ try { localStorage.removeItem(PASS_KEY); } catch(e){} }
  await new Promise(done=>{
    const main = document.getElementById("main");
    const inp = h("input",{class:"i", id:"pass", type:"password", autocomplete:"current-password", autocapitalize:"off", placeholder:"合言葉"});
    const msg = h("p",{class:"small",style:"margin:0;color:var(--red)"}, saved ? "合言葉が変わりました。社長から届いた新しい合言葉を入れてください。" : "");
    const btn = h("button",{class:"btn primary", type:"submit"},"開く");
    const form = h("form",{class:"panel stack", onsubmit:async e=>{ e.preventDefault(); btn.disabled = true; msg.textContent = "";
      try { PUB = await decryptPub(env, inp.value); try { localStorage.setItem(PASS_KEY, inp.value); } catch(e){} done(); }
      catch(err){ msg.textContent = "合言葉が違います。社長から届いたLINEを確認してください。"; btn.disabled = false; inp.select(); } }},
      field("合言葉", inp), msg, btn);
    main.replaceChildren(h("div",{class:"gate"}, h("p",{class:"eyebrow"},"MOGAMI PARTNER"), h("h1",null,"合言葉を入れてください"),
      h("p",{class:"muted"},"株式会社もがみの社員・お取引先さま専用です。合言葉は社長からLINEでお知らせしています。一度入れると、この端末では次から入力不要です（合言葉は毎月はじめに変わります）。"), form));
    inp.focus();
  });
}

(async function boot(){
  const RL = readResultLink(); if (RL){ resultLinkView(RL); return; }
  if (PUB && PUB.enc) await unlockPub();
  try { const hh = location.hash.replace("#",""); if (ROUTES.some(r=>r.id===hh)) S.route = hh; } catch(e){}
  if (!window.claude || !window.claude.use){ S.conn = "nodb"; guestify(); render(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  claude.use("assets").then(a=>{ S.assets = a; });
  claude.use("downloads").then(d=>{ S.downloads = d; });
  S.db = db; S.user = user;
  if (!db){ S.conn = "nodb"; guestify(); render(); return; }
  S.uid = user ? await user.id() : null;
  S.isOwner = user ? await user.isOwner() : false;
  const cw = user ? await user.can("data.write") : null;
  if (cw===false) S.readOnly = true;
  S.conn = "ok";
  if (!S.uid){ guestify(); render(); return; }
  if (!S.isOwner && cw===false) guestify();
  const onErr = e => { console.warn(e); if (e && e.code==="revoked"){ S.conn="nodb"; render(); } };
  let subs = [];
  function startData(){
    if (subs.length) return;
    subs.push(db.collection("staff").onSnapshot(q=>{ const m={}; q.docs.forEach(d=>m[d.id]=d.data()); S.staff=m; scheduleRender(); }, onErr));
    subs.push(db.collection("products").onSnapshot(q=>{ S.products = q.docs.map(d=>({id:d.id, ...normScale(d.data())})).sort((a,b)=>(a.demo?1:0)-(b.demo?1:0) || String(a.name).localeCompare(String(b.name),"ja")); scheduleRender(); }, onErr));
    subs.push(db.collection("customers").onSnapshot(q=>{ S.customers = q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")); scheduleRender(); }, onErr));
    subs.push(db.doc("settings/pricing").onSnapshot(d=>{ S.pricing = d.exists ? d.data() : null; if (!(document.activeElement && String(document.activeElement.id).startsWith("pr-"))) S.pDraft = null; if (!(document.activeElement && String(document.activeElement.id).startsWith("mg-"))) S.mgDraft = null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/extras").onSnapshot(d=>{ S.extras = d.exists ? d.data() : null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/staff_key").onSnapshot(d=>{ S.staffKey = d.exists ? d.data() : null; applyStaffKey(S.staffKey); scheduleRender(); }, onErr));
    subs.push(db.doc("settings/extras_cost").onSnapshot(d=>{ S.extrasCost = d.exists ? d.data() : null; scheduleRender(); }, onErr));
    subs.push(db.doc("settings/weights").onSnapshot(d=>{ S.weights = d.exists ? d.data() : null; if (!S.wDraft || !document.activeElement || !String(document.activeElement.id).startsWith("w-")) S.wDraft = null; scheduleRender(); }, onErr));
    if (S.isOwner) subs.push(db.collection("access_requests").onSnapshot(q=>{ S.requests = q.docs.map(d=>({id:d.id, ...d.data()})); scheduleRender(); }, onErr));
  }
  db.doc("staff/"+S.uid).onSnapshot(d=>{ S.myStaff = d.exists ? d.data() : null; if (role()) startData(); scheduleRender(); }, onErr);
  if (!S.isOwner) db.doc("access_requests/"+S.uid).onSnapshot(d=>{ S.myReq = d.exists ? d.data() : null; scheduleRender(); }, onErr);
  if (S.isOwner) startData();
  render();
  if (S.isOwner && ssGet("mp-sync")) pollSync();
})();
